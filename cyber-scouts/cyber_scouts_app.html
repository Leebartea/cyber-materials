Cyber Scouts is an **open-source intelligence (OSINT)** course: finding, collecting and checking information that is already public — domain registrations, certificates, public records, photos, maps — and turning it into a report someone can rely on.

It is the deep version of one module. **Cyber Guardians M11.7** (Passive Reconnaissance) gives you the core idea in an afternoon: learn about a target without sending it a single packet. Cyber Scouts takes that idea and builds a whole discipline around it: the law, the method, the sources, and the habits that stop an investigator from hurting someone with a wrong answer.

**What it is not:** a hacking course. Nothing here logs into anything, guesses a password, or scans a machine. If an exercise ever seems to need that, you have left OSINT, and you should stop.

#### How you practise safely

Every lab uses only three kinds of target:

- **yourself**: your own accounts and your own digital footprint;
- **reserved names**: \`example.com\`, \`example.net\` and \`example.org\`, set aside for documentation by RFC 2606;
- **public registries and archives**: services whose whole job is to answer lookups from anyone.

Real people who have not agreed to it are never practice targets. S1.1 explains why that rule is legal, contractual *and* ethical, and not only politeness.

#### Setup

Cyber Scouts shares the Guardians environment. Follow \`cyber-guardians/MY_SETUP_M2PRO.md\` if you have not already. Then confirm the four tools Level 1 uses:

\`\`\`bash
curl --version | head -1 | cut -d' ' -f1-2
dig -v 2>&1 | head -1
shasum -a 256 /dev/null
jq --version
\`\`\`

\`\`\`text
curl 8.7.1
DiG 9.10.6
e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855  /dev/null
jq-1.8.2
\`\`\`

Your version numbers may differ. That is fine as long as each command prints a version rather than \`command not found\`. If \`jq\` is missing, run \`brew install jq\`. The hash line should match **exactly**. \`e3b0c442…b855\` is the SHA-256 of zero bytes, the same on every computer in the world. You'll use that fact in S1.1.

#### Level 1 — Scout

Level 1 builds the working method first, then applies it one source family at a time:

    theory: `#### Define the words first

- **OSINT** — open-source intelligence: intelligence produced from publicly available information. "Open source" means *publicly available*; it has nothing to do with open-source software.
- **Scope** — the written boundary of an investigation: what you may look at, about whom, and for what purpose. Anything outside it is not part of the job, however interesting.
- **Authorisation** — someone with the right to say yes has said yes, in a form you can show later. For practice in this course, you authorise yourself — and so you may only look at yourself, reserved test domains, and public registries.
- **Collection record** — what you write down at the moment you collect something: what it is, when, who collected it, from where, and a fingerprint of the file.
- **Hash** — a short fingerprint computed from every byte of a file. Change one byte and the fingerprint changes completely. SHA-256 is the standard choice today.
- **Personal data** — under UK and EU GDPR, any information relating to an identified or identifiable living person. A name, a username, a photo, an email address — public or not.

#### The first question is still "whose log?"

Cyber Guardians M11.7 introduced the test that separates passive from active reconnaissance: **whose log does this request land in?** A query to a domain registry lands in the registry's log. Opening the target's own website lands in the target's. That test decides whether the target can see you.

Cyber Scouts adds three more questions, and none of them is about being seen. An investigation can be perfectly passive and still be unlawful, a breach of contract, or harmful to a person who never did anything wrong. **Before any collection, answer all four:**

| Question | What it protects | Where the answer comes from |
|---|---|---|
| Whose log does it land in? | You, from alerting the target | How the source works |
| Is the access authorised? | You, from computer-misuse law | The law, and your scope |
| Am I allowed to take it this way? | You, from breach of contract | The source's terms |
| Should I keep it at all? | The people in the data | Data-protection law and ethics |

#### 1 — Access: computer-misuse law

**UK.** Section 1 of the Computer Misuse Act 1990 makes it an offence to cause a computer to perform any function intending to secure access to a program or data, when the access is **unauthorised** and you **know** it is. The maximum sentence on indictment is **two years**. Notice what the offence turns on: not damage, not intent to steal — just knowingly unauthorised access.

**US.** The Computer Fraud and Abuse Act (18 U.S.C. § 1030) covers accessing a computer "without authorization" or in a way that "exceeds authorized access". In *Van Buren v. United States* (decided 3 June 2021, 6–3, opinion by Justice Barrett) the Supreme Court read those words narrowly. Liability "stems from a gates-up-or-down inquiry—one either can or cannot access a computer system", and you exceed authorised access when you get into *parts* of a system — files, folders, databases — that are off limits to you. Misusing information you were allowed to reach is not, on its own, a CFAA offence.

The practical rule for an OSINT investigator follows directly: **public pages have no gate.** Logging in with an account you are not entitled to, guessing a URL to a page that sits behind a login, or using someone else's credentials — each of those goes through a gate. None of them is OSINT.

#### 2 — Contract: the terms you agreed to

*hiQ Labs v. LinkedIn* is the case everyone cites as "scraping is legal", and it shows why that is half the story. hiQ scraped public LinkedIn profiles. In April 2022 the Ninth Circuit held that hiQ had raised serious questions about whether scraping *public* pages is access "without authorization" under the CFAA at all — for data open to everyone, there is no gate to pass. hiQ won that argument.

Then it lost the case. Back in the district court, hiQ was found to have breached LinkedIn's User Agreement — and it had also used fake accounts to reach pages behind the login. In December 2022 the parties filed a consent judgment of **$500,000 against hiQ**, with a permanent injunction to stop scraping and destroy the data and code built from it.

**The lesson:** "not a crime" and "allowed" are different findings. A site's terms can forbid automated collection even of public pages, and breaking them is a civil wrong with real remedies.

#### 3 — People: data-protection law

Public availability is **not** a lawful basis for processing personal data. Under UK and EU GDPR, collecting someone's name, role and handle from a public profile *is* processing. You need a lawful basis — on a professional engagement it comes from the contract and scope; on a personal whim you have none.

GDPR also expects people to be told. **Article 14** covers data "not obtained from the data subject" — which is exactly what OSINT produces — and sets a deadline of **one month** to inform them. Its exemptions (Art. 14(5)) include where informing them "proves impossible or would involve a disproportionate effort", or would seriously impair the purpose of the processing. Investigators rely on those exemptions; they have to be able to justify them, not assume them.

*This module is not legal advice, and the law differs by country. It teaches you which questions to ask. On a real engagement, the answers come from your client's lawyers, in writing, before you start.*

#### 4 — Method: the Berkeley Protocol

The **Berkeley Protocol on Digital Open Source Investigations** was published in December 2020 by the UN Office of the High Commissioner for Human Rights and the Human Rights Center at UC Berkeley School of Law. It was written for investigations that may end up in court, which is why it is strict — and why it is a good habit to learn first.

It organises an investigation into six phases:

1. **Online inquiries** — searching and discovering.
2. **Preliminary assessment** — is this relevant, and is it in scope?
3. **Collection** — capturing the item, with its record.
4. **Preservation** — keeping it safe and unaltered.
5. **Verification** — is it what it appears to be?
6. **Investigative analysis** — what does it mean?

Its principles name **accuracy, data minimisation, data preservation and security by design** as the methodological minimum. **Data minimisation** is the one beginners skip: collect what the question needs, not everything you can reach.

For every item, the Protocol asks you to record the collection data — **who collected it, from which machine, under which (if any) research identity, and when** — and to make sure your system clock is accurate, preferably synchronised to a time server. It also asks for a **hash value** at the point of collection, so you can later show the item "has not been modified since the time of collection".

#### What a hash proves — and what it does not

\`\`\`bash
printf 'registrar: Example Registrar\\n' | shasum -a 256
printf 'registrar: Example Registrar.\\n' | shasum -a 256
\`\`\`

\`\`\`text
31138c4756edfb97dd8bd193bb7293e946e7ac4c34bc1b81c37e7a36b56d9f83  -
a844aa1f86e3f0d151093132c7558dc1ec721ef0d5f8a14f0275ff38b6f6df86  -
\`\`\`

Run it yourself and you will get exactly these two hashes. The input is fixed, so the output is too. One full stop at the end of the line changes every character of the fingerprint. That is why a hash in your log catches even the smallest edit.

A matching hash proves **integrity**: the file is byte-for-byte what was collected. It does not prove **authenticity** (the content is true), **provenance** (it came from where the log says), or **currency** (the source still says the same thing). Those need the rest of the record — and the verification phase.

#### Where this sits in ATT&CK

The adversary version of this work is ATT&CK's **Reconnaissance** tactic, TA0043 — for example **T1593** (Search Open Websites/Domains) and **T1589** (Gather Victim Identity Information). Defenders study it for the same reason you do: to see their organisation the way an attacker's first week does. The difference between you and that attacker is the scope record, not the technique.`,

    theory: `#### Define the words first

- **Registry** — the organisation that runs a top-level domain and keeps the master list of names in it: Verisign for \`.com\`, Public Interest Registry for \`.org\`. For IP addresses and AS numbers the equivalent is a **regional internet registry (RIR)**. There are five: AFRINIC, APNIC, ARIN, LACNIC and RIPE NCC.
- **Registrar** — the company that sells a domain to the public and submits it to the registry. Every ICANN-accredited registrar has a number, its **IANA Registrar ID**.
- **Registrant** — whoever registered the domain: a company, a person, or a privacy service standing in for either.
- **RDAP** — the Registration Data Access Protocol. You ask a question over HTTPS and get back structured JSON. It is defined by five IETF standards: RFC 7480 (HTTP use), 7481 (security), 9082 (queries), 9083 (responses) and 9224 (finding the right server).
- **WHOIS** — RDAP's predecessor (RFC 3912, 2004). It answers in free text that each registry formats its own way, and it has no standard way to find the right server.
- **Bootstrap file** — a map published by IANA that says which RDAP server is authoritative for each top-level domain, IP range or AS number range.
- **Handle** — a registry's own identifier for a record, such as \`NET-192-0-2-0-1\`.

#### Whose log? The registry's.

Every request in this module goes to IANA, a domain registry or an RIR. The target's own servers never see it. In S1.1's terms, that makes RDAP about as passive as a source can be.

One caution. A third-party "WHOIS lookup" website is a *different* third party: your query lands in its log, under its terms, and it may do other things with it. The lab talks to the registries directly, so you know exactly whose log each request lands in.

#### From WHOIS to RDAP

RDAP fixed three things WHOIS never had:

1. **A fixed structure.** Every response is JSON with named fields (RFC 9083). You can read a field with \`jq\` instead of guessing at one registry's text layout.
2. **A way to find the right server** (RFC 9224): the IANA bootstrap files below.
3. **A record of what was withheld** (RFC 9537, 2024): a \`redacted\` list that names each field the server left out and how.

For generic top-level domains (\`.com\`, \`.org\`, \`.app\` and the rest), ICANN made RDAP the definitive source on **28 January 2025**. From that date gTLD registries and registrars are no longer required to run WHOIS, except for \`.com\`, \`.name\` and \`.post\`. Some still run it voluntarily. Country-code domains such as \`.uk\` or \`.de\` are outside that change. Each decides for itself.

#### Step 1 — ask IANA who is authoritative

IANA publishes four bootstrap files at \`https://data.iana.org/rdap/\`: \`dns.json\`, \`ipv4.json\`, \`ipv6.json\` and \`asn.json\`. Each holds a \`services\` list, and every entry pairs a list of keys with a list of server URLs:

\`\`\`text
[ ["com"], ["https://rdap.verisign.com/com/v1/"] ]
\`\`\`

Find the entry containing your key and put the query on the end of the URL: \`domain/example.com\`, \`ip/192.0.2.1\` or \`autnum/64496\`.

Not every TLD is in the file. On 24 September 2026 the DNS file (published 16 September 2026) listed 1,202 of the 1,438 top-level domains in IANA's root list. \`.fr\`, \`.uk\` and \`.au\` were in it. \`.de\`, \`.jp\` and \`.io\` were not. **"Not in the file" does not mean "no data".** It means that registry has not listed an RDAP server with IANA. Its own website or WHOIS service is then the fallback, and your collection record says which one you used.

Keep the bootstrap file you used as evidence. It is the reason you asked *that* server, and it changes over time.

#### Step 2 — read a domain record

| Field | What it holds |
|---|---|
| \`ldhName\` | the domain name, as the registry stores it |
| \`status\` | locks and states. RFC 5731 status values starting with "client" are set by the registrar, and values starting with "server" are set by the registry. RFC 8056 maps them to the RDAP strings you see, such as \`client transfer prohibited\`. |
| \`events\` | dated events: \`registration\`, \`expiration\`, \`last changed\`, \`last update of RDAP database\` |
| \`entities\` | the parties, each with \`roles\` (\`registrar\`, \`registrant\`, \`technical\`, \`abuse\` …) and contact details in \`vcardArray\` |
| \`nameservers\` | the DNS servers the domain is delegated to |
| \`secureDNS\` | whether the delegation is signed with DNSSEC |
| \`rdapConformance\` | which specifications the response claims to follow. \`redacted\` here means an RFC 9537 list is present. |
| \`links\` | related URLs, including \`self\` (this record) |

The lab reads \`example.com\` from Verisign and \`example.org\` from Public Interest Registry. Three findings from the run on 24 September 2026:

- **Same registrar ID, two names.** Both records name registrar **376**. Verisign calls it *"RESERVED-Internet Assigned Numbers Authority"*; PIR calls it *"ICANN"*. Two registries gave the same entity two labels. **Join records on IDs, never on names.**
- **Where the trail ends.** For an ordinary gTLD domain, the registrar runs its own RDAP service. Since ICANN's 2023 contract amendments every gTLD registrar must, for all the domains it sponsors. IANA's Registrar IDs registry lists each registrar's RDAP base URL. ID 376 has status *Reserved* and no RDAP server, so for \`example.com\` the registry record is all there is.

#### Redaction: what the record deliberately leaves out

GDPR began to apply on 25 May 2018. The ICANN Board had adopted a *Temporary Specification* for gTLD registration data on 17 May 2018. Its successor, the **Registration Data Policy**, has been in force since **21 August 2025**. For the registrant data elements it lists, the policy says the output "MUST NOT include the value of the data element … and MUST indicate that the value is redacted", unless the registrant has given consent to publish.

So when a registrant's name, email and phone come back as redacted, the system is working as designed. Some people with a legitimate need (police, lawyers, security teams) can ask for non-public data through ICANN's Registration Data Request Service (RDRS) or the registrar's own disclosure process. That is a formal request made by someone with a lawful basis. It is not a practice tool, and nothing in this course uses it.

#### Numbers have registries too

The same method works for IP addresses and AS numbers. The IPv4 bootstrap file maps address blocks to the five RIRs' RDAP servers; the ASN file maps number ranges.

An IP record tells you which organisation holds an address block, usually a network operator such as an ISP, a cloud provider or a hosting company. It does not tell you who was using a particular address at a particular moment. Only the operator's own records can show that, and a Scout cannot see those.

#### What a registration record proves — and what it does not

A record, collected and hashed the S1.1 way, proves that **this registry said this at this time**. It does not prove any of the following:

- **Who a person is.** Contact data is whatever the registrant supplied, and a privacy service may stand in for them. Most of it is redacted anyway.

- **Who used an IP address.** See above.

- **Certificate** — the signed file a website presents when you connect over HTTPS. It binds a public key to one or more names, and your browser checks it before trusting the connection.

- **Subject Alternative Name (SAN)** — the part of a certificate that lists every name it is valid for. One certificate can cover many names, even names in different domains.

The lab sends requests to two places only: crt.sh (so your queries land in Sectigo's logs) and Google's published list of CT logs. The target's servers see nothing. The certificates were published by the CAs when they were issued, not by you.

The boundary comes *after* the lab. CT hands you a list of names, and the obvious next step is to look them up. Remember S1.1's Drill 1: a DNS lookup lands in your resolver's log, and the resolver may then ask the domain's own name servers, as itself. That is a question about a name few other people ever ask about, sent to servers the target runs. Connecting to the name is plainly active. Whether either step is in scope is a decision you write in \`scope.txt\` before you take it. This lab stops at the list.

#### Why the logs exist, and why they are nearly complete

RFC 6962 puts the purpose in one sentence: "The logs do not themselves prevent misissue, but they ensure that interested parties (particularly those named in certificates) can detect such misissuance." CT does not stop a CA issuing a certificate it should not. It makes sure the issuance cannot stay secret.

The logs are nearly complete for the public web because browsers enforce them. **Chrome requires every publicly-trusted TLS certificate issued after 30 April 2018 to support CT**, or it will not accept it. Its policy says how many SCTs a certificate needs:

| Certificate lifetime | SCTs needed, from distinct logs |
|---|---|
| 180 days or less | 2 |
| more than 180 days | 3 |

On top of that, at least two of those SCTs must come from **different log operators**, and at least one must come from a log Chrome still counts as *Qualified*, *Usable* or *ReadOnly*. An SCT from a log that has since been *Retired* still counts, but only if it was issued before the log's retirement date.

What this does *not* cover: the policy applies to publicly-trusted certificates. A certificate from an organisation's own internal CA, trusted only on its own machines, has no reason to be in any log.

#### Step 1 — ask the index

crt.sh answers \`?q=example.com&output=json\` with one JSON object per log entry. The fields that matter are \`id\` (crt.sh's own ID), \`serial_number\`, \`issuer_name\`, \`not_before\`, \`not_after\` and \`name_value\`. Add \`&exclude=expired\` to drop expired certificates.

crt.sh is busy, and it often answers **502** when overloaded. On the first try for this module it did exactly that. An error is not an answer. Retry it, and if it still fails, log the failure. Never write "no certificates" on the strength of an error page.

#### Step 3 — which logs vouched for it?

Each SCT carries a log ID: the SHA-256 hash of that log's public key. Google publishes the list of logs Chrome recognises at \`https://www.gstatic.com/ct/log_list/v3/log_list.json\`. Match the IDs against it. The three SCTs in the lab certificate came from **Google 'Argon2026h2'**, **Sectigo 'Elephant2026h2'** and **Let's Encrypt 'Oak2026h2'**, all timestamped 2 December 2025.

A CT entry, collected and hashed the S1.1 way, proves that **a CA issued (or, for a precertificate, prepared to issue) a certificate for these names, and a log recorded it**. It does not prove any of the following:

- **Registered agent** — a firm whose address a company uses to receive official legal papers. It is often nowhere near where the company works.
- **Subsidiary** — a company another company controls. **Consolidation** means the parent includes the subsidiary in its own accounts.
- **Identity resolution** — deciding whether two records describe the same entity or person. It is the step where most people-and-organisation mistakes are made.
- **Role record** — an entry that names a person *because of a position they hold*: a director on a register, an officer who signs a filing. It is dated and it belongs to the role.

#### Whose log? GLEIF's and the SEC's.

The lab sends requests to two places: GLEIF's API and the SEC's EDGAR archive. It sends nothing to the company's own servers.

The SEC asks every automated client to say who it is. Its fair-access rules ask for a User-Agent header in the form "Sample Company Name AdminContact@<sample company domain>.com", and a rate of no more than 10 requests a second. So your contact address lands in the SEC's logs. That is a fair price for the data, but notice that it is a disclosure you make. The lab sends it to the SEC and not to GLEIF, which does not ask for it. Minimisation applies to what you give away as well as to what you collect.

#### Organisations first; people only through their roles

This module's subject is an organisation, and that is deliberate. A company publishes register entries because the law requires it. A person appears in them only because of a role they hold.

As in S1.1, a person's name is personal data even when it is published, and collecting it is processing. The principle that matters most here is **data minimisation**. GDPR Article 5(1)(c) (the UK GDPR has the same words) requires personal data to be "adequate, relevant and limited to what is necessary in relation to the purposes for which they are processed". For a person found in a register, that means you record the role, the filing and the date. The rest of their life stays out of your case file.

This fits the course rule that real people are never practice targets. The lab's target is a listed company, researched through public registries. The one person it names appears because a statutory filing names them in their role, and the lab collects that entry and nothing else.

#### Step 1 — a name is a search term, not an identifier

Search GLEIF for the legal name "Apple Inc." and you get back **24 records from 15 jurisdictions**, in the run on 24 September 2026. Only one of them has that exact legal name. The rest include APPLE CANADA INC., APPLE TEXAS RESTAURANTS, INC., Apple Tree Montessori Inc and Apple Hospitality REIT, Inc. GLEIF's name filter is a text search, so "Apple Inc." matches any name containing those words.

#### Step 2 — read the record: two addresses and a register

| Field | Value |
|---|---|
| Legal address | C/O C T Corporation System, 330 N. Brand Blvd, Suite 700, Glendale |
| Headquarters address | One Apple Park Way, Cupertino |

The legal address is a registered agent's office. It is where official papers are served, and it tells you nothing about where the company works. Reporting "Apple is based in Glendale" would be a real mistake, and an easy one to make.

#### Step 3 — "who owns whom" is really "who consolidates whom"

GLEIF also publishes relationships between entities. For this LEI it lists **20 ultimate children**. Read the relationship type before you use the list. It is \`IS_ULTIMATELY_CONSOLIDATED_BY\`: the parent includes these companies in its consolidated accounts. That is an accounting relationship, not a share register.

Then read how the list was checked. All 20 relationships are marked \`ENTITY_SUPPLIED_ONLY\`. GLEIF's relationship-record format defines that as information with "significant reliance on the information that a submitter provided due to the unavailability of corroborating information". The entity record was fully checked; the family tree is the company's own account of itself.

#### Step 4 — a second source that does not copy the first

- **GLEIF: 20 names.** Only companies that have an LEI and reported the relationship.

- **Breach** — an incident in which data leaves an organisation's control without authorisation. The data that leaks is often called a **dump**.
- **Combolist** — a file of email-and-password pairs, often merged from many breaches and sometimes partly invented. It does not come from any single source.
- **Credential stuffing** — trying leaked email-and-password pairs on *other* sites, betting that people reuse passwords.
- **Stealer log** — data taken from an infected computer by malware: saved passwords, cookies, the sites they belong to.
- **Data class** — a kind of data a breach contained: email addresses, passwords, dates of birth, and so on. The data classes decide what the harm is.
- **Hash (SHA-1)** — a fixed-length fingerprint of some input. The same input always gives the same hash; the hash does not let you read the input back.
- **k-anonymity** — a privacy property: your query looks the same as at least *k* others', so the service cannot tell which one was yours.
- **Have I Been Pwned (HIBP)** — a breach-notification service run by Troy Hunt. It publishes a catalogue of the breaches it has loaded, and **Pwned Passwords**, a free service for checking passwords seen in breaches.

#### The line this module never crosses

Breach exposure is the one OSINT topic where the evidence itself is stolen. A dump of someone else's customers is personal data that its controller never agreed to release. So this module works only with **records about breaches**, never with the breach data itself.

Every request in the lab goes to HIBP, and each one tells it something different:

| Request | What HIBP learns |
|---|---|
| The breach catalogue, or one breach by name | That someone read public records about breaches |
| A Pwned Passwords range | Your IP address and **five hexadecimal characters** of a password's hash |
| An email-address search (not in this lab) | The address you asked about, and that *you* were curious about it |

#### Step 1 — a breach catalogue is a list of claims

| \`IsFabricated\` | "unlikely to have been hacked from the indicated website and usually contains a large amount of manufactured data" | 3 |
| \`IsSpamList\` | "the data has not come as a result of a security compromise" | 16 |
| \`IsSensitive\` | "The public API will not return any email addresses for a breach flagged as sensitive" | 94 |

Two details matter. First, a fabricated breach "still contains legitimate email addresses". The named company was probably not breached, but real people's data is still in it. Second, **the flags are independent**. Paytm is flagged fabricated *and* verified at the same time. A report that checked only \`IsVerified\` would call it a real Paytm breach. Read every flag.

#### Step 2 — read one breach as a record

The Adobe record says: breach date 2013-10-04, added to HIBP 2013-12-04, **152445165 addresses**, data classes *Email addresses, Password hints, Passwords, Usernames*. Each of those fields needs care:

#### Step 3 — two questions about an organisation, only one of them yours

2. **Do its staff's addresses appear in other breaches?** That question is about people. HIBP answers it only for a domain you can prove you control, and without that proof its API returns HTTP 403. The question belongs to the organisation itself, or to someone it has authorised in writing.

An OSINT report can answer the first. It should say plainly that the second is out of scope, and why.

#### Step 4 — checking a password without sending it

Pwned Passwords holds hashes of passwords seen in breaches. You never send it a password, and you never send it a whole hash either:

1. Compute the SHA-1 of the password **on your own machine**. For \`P@ssw0rd\` it is \`21BD12DC183F740EE76F27B78EB39C8AD972A757\`.
2. Send only the first five characters, \`21BD1\`.

    theory: `#### Define the words first

- **Geolocation** — working out *where* a photo or video was taken. **Chronolocation** is the same question about *when*.
- **EXIF** — the metadata standard cameras and phones use to write facts about a photo into the file itself: the device, the settings, the time and, if location was switched on, a GPS position.
- **XMP** — a second, more general metadata format. Some software writes location into it, so a file can carry a position in XMP even when its EXIF has none.
- **Decimal degrees** — a position as two signed numbers, such as \`51.507428, -0.078081\`. Latitude first. North and east are positive; south and west are negative.
- **DMS** — the same position as degrees, minutes and seconds plus a letter: \`51° 30' 26.74" N\`. EXIF stores it this way, with the letter in a separate **Ref** tag.
- **Datum** — the model of the Earth the numbers refer to. GPS uses **WGS 84**. A position without a datum is ambiguous: a phone's position is most likely WGS 84, but the file only says so if it records a datum.
- **Heading** — the direction the camera was pointing, in degrees clockwise from north (0 = north, 90 = east). EXIF stores it as \`GPSImgDirection\`, measured from true or magnetic north.

#### The line this module never crosses

A photo's location is the most dangerous fact in open-source research, because it can lead someone to a person's door. So this module only ever examines **photos of public places, published by their authors for reuse**. The lab uses one such photo. The same technique pointed at a photo of a person, or at their home, is how people get stalked.

In England and Wales, section 2A of the Protection from Harassment Act 1997 makes stalking an offence. It covers a course of conduct that amounts to harassment and involves acts "associated with stalking". The Act's own examples include "monitoring the use by a person of the internet, email or any other form of electronic communication" and "watching or spying on a person". Working out where someone lives from their photos, as part of that kind of conduct, fits those examples.

So, as a rule for this course: **never geolocate a photo of a person, or of anywhere a person lives, and never work out who took a photo or where they live.** The lab's scope file says the same thing.

#### Whose log? Three of them

- **Wikimedia's.** Commons and Wikidata see your IP address, which file and which items you asked for, and your **User-Agent**. Wikimedia's User-Agent policy asks scripts to include contact details, and scripts without an informative User-Agent "may be blocked without notice". The lab asks you to put your own address in \`CONTACT\`. Leave the placeholder and \`upload.wikimedia.org\` refuses it: when this module was written, the exact string \`you@example.com\` got HTTP 403, while other addresses were accepted.
- **Yours.** The collection log from S1.1, one line per request.
- **The photographer's.** EXIF is a log the photographer's phone wrote without asking. Everything in Step 2 comes from it, which is why the photographer's consent to publish it matters.

Commons publishes a SHA-1 hash of every upload. The lab compares it with the SHA-1 of the file you downloaded. If they differ, you are not looking at the file Commons describes, and nothing you read from it is evidence. Your log also records a SHA-256 of the file, as in S1.1.

#### Step 2 — read what the file claims, as it stores it

The photo, \`LONDON BRIDGE.jpg\`, was taken on an iPhone 8 and uploaded to Commons in 2018. Its EXIF says:

\`\`\`text
GPSLatitude                     : 51 deg 30' 26.74" N
GPSLongitude                    : 0 deg 4' 41.09" W
GPSHPositioningError            : 10 m
GPSImgDirectionRef              : True North
GPSImgDirection                 : 75.18820225
GPSMapDatum                     : -
\`\`\`

Three things to notice:

- **The letter is a separate tag.** EXIF stores \`0 deg 4' 41.09"\` and, elsewhere, \`W\`.
- **The error is stated: 10 m.** \`GPSHPositioningError\` is the device's own estimate of how far off its position might be. It is an estimate, not a guarantee.
- **There is no datum.** The Exif standard says recording \`GPSMapDatum\` is "strongly recommended" when there is any GPS data. This phone did not record it. Your report should say "WGS 84 assumed", not "WGS 84".

#### Step 3 — the sign trap

Ask ExifTool for plain numbers (\`-n\`) and the GPS tag gives \`0.0780805555555556\`: **positive**. The minus sign lives in \`GPSLongitudeRef\`. ExifTool's **Composite** tag combines the two and gives \`-0.0780805555555556\`. Use the Composite value, or apply the Ref yourself.

This mistake is easy to make and hard to notice. A longitude of +0.078 instead of −0.078 is 0.156° further east, which at London's latitude is about 11 km. The wrong point is still in London and still plausible. Nothing warns you.

#### Step 4 — precision is not accuracy

The lab prints six decimal places: \`51.507428, -0.078081\`. Six places resolve about 0.1 m. The phone says it could be 10 m out. Workbench Drill 1 works out that four places, about 11 m north–south, is the most this photo supports. Write \`51.5074, -0.0781 (±10 m, device-stated)\`. More digits would claim a precision the evidence does not have.

#### Step 5 — two clocks

\`\`\`text
DateTimeOriginal                : 2018:08:26 09:42:06
OffsetTimeOriginal              : -
GPSDateTime                     : 2018:08:26 08:42:06Z
\`\`\`

\`DateTimeOriginal\` is the camera's local clock, with **no time zone**. The Exif standard only added tags for the zone offset (\`OffsetTime…\`) in version 2.31, in July 2016, and this file does not have one. The GPS stamp is different: the standard defines it as UTC. So the two clocks together give the offset: one hour. London on 26 August 2018 was on British Summer Time, UTC+1, so the clocks agree with the position. Drill 2 checks that against the time-zone database instead of from memory.

If the clocks disagree, that is a finding. The camera's clock might be set wrong, or the file might have been edited. Report it; do not choose the one you prefer.

#### Step 6 — test every claim against something independent

The file makes three claims about place. Test each one.

#### 🟡 Drill 2 — reconcile the two clocks ~8 min

**Goal.** Work out the difference between the camera's clock and the GPS clock, then ask the time-zone database what London's offset was at that instant. Do not use your memory of when summer time starts.

**Done when.** Three lines: both clocks, the difference in minutes, and London's zone at the GPS instant. And one sentence on whether they agree.

TL=$(TZ=UTC date -j -f "%Y:%m:%d %H:%M:%S" "$L" +%s)
TU=$(TZ=UTC date -j -f "%Y:%m:%d %H:%M:%S" "$U" +%s)
echo "difference: $(( (TL - TU) / 60 )) minutes"
TZ=Europe/London date -r "$TU" "+London at that instant: %Y-%m-%d %H:%M:%S %Z (UTC%z)"

The GPS stamp records the moment of the position fix, not necessarily the moment the shutter opened. So a difference of a few seconds from a whole number of minutes can be normal. A difference that is not close to a real zone offset is a finding: report it and do not explain it away.
