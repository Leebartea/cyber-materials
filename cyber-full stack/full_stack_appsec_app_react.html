\`\`\`javascript
// server.js — registration ceremony (secure)
const {
  generateRegistrationOptions, verifyRegistrationResponse,
} = require('@simplewebauthn/server');

const RP_ID = 'localhost';                  // dev RP ID; in prod = your eTLD+1, e.g. 'example.com'
const ORIGIN = 'http://localhost:3000';     // in prod = 'https://example.com'

app.get('/webauthn/register', async (req, res) => {
  const user = req.session.user;            // an already-identified (e.g. email-verified) user
  const options = await generateRegistrationOptions({
    rpName: 'My App', rpID: RP_ID,
    userName: user.email,
    attestationType: 'none',                // WHY: don't demand attestation without a policy reason
    // WHY: excludeCredentials stops a user re-registering a key they already have
    excludeCredentials: user.credentials.map((c) => ({ id: c.id, type: 'public-key' })),
    authenticatorSelection: { residentKey: 'preferred', userVerification: 'preferred' },
  });
  req.session.currentChallenge = options.challenge;  // WHY: server-stored, single-use challenge
  res.json(options);
});

app.post('/webauthn/register/verify', async (req, res) => {
  const verification = await verifyRegistrationResponse({
    response: req.body,
    expectedChallenge: req.session.currentChallenge, // WHY: must match what WE issued (anti-replay)
    expectedOrigin: ORIGIN,                          // WHY: origin binding
    expectedRPID: RP_ID,                             // WHY: phishing-resistance anchor
  });
  if (verification.verified) {
    const { credentialPublicKey, credentialID, counter } = verification.registrationInfo;
    // WHY: store the PUBLIC key + credential ID + counter; there is no secret to leak.
    await saveCredential(req.session.user.id, { credentialID, credentialPublicKey, counter });
    return res.json({ ok: true });
  }
  res.status(400).json({ ok: false });
});

# app.py — registration ceremony (secure), Flask + py_webauthn
from flask import Flask, session, request, jsonify
from webauthn import (
    generate_registration_options, verify_registration_response, options_to_json,
)
from webauthn.helpers.structs import (
    AuthenticatorSelectionCriteria, ResidentKeyRequirement,
    UserVerificationRequirement, PublicKeyCredentialDescriptor,
)

RP_ID = "localhost"                     # dev RP ID; in prod = your eTLD+1, e.g. "example.com"
ORIGIN = "http://localhost:3000"        # in prod = "https://example.com"

@app.get("/webauthn/register")
def register_options():
    user = session["user"]              # an already-identified (e.g. email-verified) user
    options = generate_registration_options(
        rp_name="My App", rp_id=RP_ID,
        user_name=user["email"],
        # WHY: exclude_credentials stops a user re-registering a key they already have
        exclude_credentials=[
            PublicKeyCredentialDescriptor(id=c["id"]) for c in user["credentials"]
        ],
        authenticator_selection=AuthenticatorSelectionCriteria(
            resident_key=ResidentKeyRequirement.PREFERRED,
            user_verification=UserVerificationRequirement.PREFERRED,
        ),
    )
    # WHY: server-stored, single-use challenge (store bytes; compare on verify)
    session["current_challenge"] = options.challenge

@app.post("/webauthn/register/verify")
def register_verify():
    verification = verify_registration_response(
        credential=request.get_data(),                       # raw JSON from the browser
        expected_challenge=session["current_challenge"],     # WHY: must match what WE issued (anti-replay)
        expected_origin=ORIGIN,                              # WHY: origin binding
        expected_rp_id=RP_ID,                                # WHY: phishing-resistance anchor
    )
    # WHY: store the PUBLIC key + credential ID + counter; there is no secret to leak.
    save_credential(session["user"]["id"], {
        "credential_id": verification.credential_id,
        "public_key": verification.credential_public_key,
        "sign_count": verification.sign_count,
    })

### 🛡️ Defense / correct usage

**Root-cause principle:** *prove possession of a private key the user never transmits, and let the browser enforce origin binding so the human can't be phished.*

**Defense-in-depth & operational rules:**
- **Always verify all six checks** server-side; a library makes this easy — *don't skip the counter or origin/RPID checks.*
- **Account recovery is mandatory.** A user can lose all passkey-syncing devices. Provide a recovery path (recovery codes at enrollment, verified-email re-enrollment) — *and make sure recovery isn't a weaker password backdoor that undoes the phishing resistance.*
- **Allow multiple credentials per user** (laptop + phone + hardware key) so losing one device isn't a lockout.
- **Step-up auth:** require a fresh WebAuthn assertion before high-risk actions (changing recovery email, large transfers), not just at login.

**Pitfalls and false-confidence traps:**
- **RP ID mismatch.** \`rpID\` must be the eTLD+1 with **no scheme and no port** (\`example.com\`, not \`https://example.com:443\`). A wrong RP ID silently breaks registration or scopes credentials too broadly.
- **The recovery-flow backdoor.** "Lost your passkey? reset with an email link + password" reintroduces phishing/credential-stuffing through the side door. Treat recovery as a first-class security surface.
- **Skipping the signature counter check.** Without it you can't detect a cloned/exported credential.
- **Don't roll your own.** Use \`@simplewebauthn\` (Node), \`py_webauthn\` (Python), \`webauthn-rs\` (Rust), or \`java-webauthn-server\` (JVM). The CBOR/COSE parsing and attestation logic are easy to get subtly wrong.
- **Cross-origin iframes.** WebAuthn refuses to operate in cross-origin frames unless explicitly permitted.

1. What single property of passwords does WebAuthn eliminate, and why does that kill an entire class of attacks?
2. Explain the exact mechanism that makes WebAuthn phishing-*resistant* where "password + TOTP" is not.
3. List the checks a server must perform on every authentication assertion.

5. What does a decreasing signature counter indicate?
6. Why is "don't roll your own WebAuthn" stronger advice than usual here?

<details>
<summary>Show answers</summary>

1. It eliminates the *shared transmitted secret*: nothing the user knows/sends can be phished, reused, replayed, or leaked from a DB — so phishing, credential stuffing, and password-storage breaches all disappear for that account.
2. The credential is scoped to an RP ID and the authenticator signs over the *actual origin the browser is on*; the browser refuses to use a \`google.com\` credential on \`g00gle-login.com\`. The domain check is made by the browser, not the human, so the user cannot be tricked into producing a usable signature for the wrong site — unlike a TOTP code a human will type anywhere.
3. Signature verifies against the stored public key; challenge matches the server-issued single-use challenge; origin matches; RP ID hash matches; user-presence/verification flags are satisfied; and the signature counter increased (clone detection).
4. Users can lose every passkey-syncing device, so without recovery they're locked out permanently. The trap is making recovery a password/email backdoor weaker than the passkey — that reintroduces phishing/credential-stuffing, undoing WebAuthn's main benefit.
5. A cloned or duplicated authenticator — a credential being used from more than one copy — which should be flagged or denied.
6. The protocol involves CBOR/COSE key parsing, attestation formats, and six interacting server-side checks; subtle mistakes silently disable the security properties while everything still "works," so a vetted library is essential.
</details>

    body: `> **Why this phase exists.** Phases 2–6 taught you to find and fix individual bugs. But you can't manually re-audit your whole app on every commit, and you certainly can't audit the 1,400 transitive npm packages you pulled in last Tuesday. The Secure SDLC builds the *finding* and the *fixing* into the conveyor belt itself — the single highest-leverage change a working full-stack developer can make. It converts security from heroics into plumbing.

### 🎯 Concept: where bugs are born and why their cost explodes over time

Every vulnerability has a *birthday* — the moment it entered your system — and a *discovery day*. The gap between those dates is where all the cost lives. The classic life cycle has six phases: **Requirements → Design → Code → Build/Test → Deploy → Operate.** A security defect can be introduced in any:
- **Requirements:** "users can share documents" — but nobody wrote down *who* may share *which* document. That omission becomes a broken-access-control bug three months later.
- **Design:** you chose to put the session token in \`localStorage\` — an architecture decision that *guarantees* XSS will be catastrophic, decided before a line was written.
- **Code:** a developer string-concatenates a SQL query.
- **Build/Test:** a vulnerable dependency is pulled in by the lockfile.
- **Deploy:** a secret is hard-coded into an env var that ends up in a public log.
- **Operate:** a CVE is published for a library you shipped six months ago; your running system is now vulnerable even though *your* code never changed.

**The naive approach — "we'll do a pentest before launch" — fails because of *when* it places discovery.** A defect born in Design and discovered in a pre-launch pentest has its blast radius baked into the entire codebase; fixing it means re-architecting, re-coding, re-testing huge swaths of work. A bug caught in design costs a fraction of the same bug in production — not because the *fix* is harder, but because everything built on top of the defect must also move.

**"Shift left" is the response.** Picture the life cycle as a left-to-right timeline; shifting left means moving each security activity as early as it usefully goes:
- Threat-model during **Design** (catch the \`localStorage\` mistake before it's written).
- Lint and static-analyze during **Code** (catch the SQL concatenation as you type).
- Scan dependencies and secrets during **Build** (catch the bad package before it merges).
- Keep monitoring CVEs during **Operate** (catch the library that *became* vulnerable after you shipped — "shift right"; you need both).

Shift-left is not "do security earlier instead of later." It is "do security *continuously*, with cheap automated checks pushed as early as possible and expensive human checks reserved for decisions automation can't make."

### 🎯 Concept: the four families of automated security checks

| Family | Full name | What it inspects | What it catches | Blind spot |
|---|---|---|---|---|
| **SAST** | Static Application Security Testing | Your source code, *without running it* | Insecure code patterns: SQLi via concatenation, \`eval\`, weak crypto, missing auth checks | Can't see runtime config, env, or whether a path is reachable |
| **SCA** | Software Composition Analysis | Your dependency tree (lockfiles, manifests) | Known-vulnerable versions of third-party packages (CVEs) | Can't find bugs in *your* code; only code you imported |
| **Secret scanning** | — | Your files and git history | Committed API keys, passwords, private keys, tokens | Only finds patterns it recognizes |
| **DAST** | Dynamic Application Security Testing | Your *running* app, by sending requests | Runtime-only issues: missing headers, reflected XSS, auth bypasses | Slow; only tests reachable paths; needs a deployed target |

You met DAST in Phase 5 (ZAP/Burp). This phase adds SAST, SCA, and secret scanning, then bolts all four into CI.

> **Mental model.** SAST reads the recipe. SCA checks the ingredients' expiry dates. Secret scanning makes sure you didn't write your house key into the recipe. DAST tastes the finished dish. You need all four because no single one can do another's job.

### 🛡️ Defense: turn the scanners into a gate, not a suggestion

A scanner you run "when you remember" provides almost no security — human memory forgets *precisely when you're busy*, which is when bugs ship. Make the checks **mandatory and automatic** with three escalating layers:

1. **Editor (fastest feedback, weakest enforcement).** Semgrep VS Code extension + ESLint security plugins so findings appear *as you type*. Advisory only.
2. **Pre-commit hook (local gate).** A git hook running gitleaks + a fast Semgrep pass before a commit. Bypassable with \`--no-verify\`, so it's a *helper*, not a *control*.
3. **CI pipeline (the real gate).** Runs on the server, on every pull request, and *blocks the merge* if checks fail. The only layer an individual developer cannot quietly skip — which makes it the actual security control.

**Root-cause principle:** the property you want is "insecure code physically cannot reach \`main\`." You get it by making the merge button depend on a check the developer doesn't control. Everything else is ergonomics.

### ⚠️ Common pitfalls and false-confidence traps

- **Green pipeline ≠ secure app.** Scanners find *known* patterns and CVEs; a novel business-logic flaw sails through. A passing pipeline means "no known-bad patterns," not "safe."
- **\`|| true\` and \`continue-on-error: true\`.** The #1 way teams accidentally disable their own gate. Audit workflows for these; they turn a control into theater.
- **Alert fatigue → blanket ignores.** A too-noisy scanner gets a sweeping ignore file and is then ignored entirely — worse than none, because it provides false assurance. Tune rules to *your* stack.
- **Scanning only on \`push\`, not \`pull_request\`.** Checks after merge protect nothing — the bad code is already on \`main\`.
- **Trusting one SCA database.** NVD, GHSA, and OSV have different coverage and lag. Run two.
- **Deleting a leaked secret instead of rotating it.** Once committed, a secret is in history forever (and likely already scraped). Revoke and reissue first, then purge history as cleanup.

### 🎯 Concept: you ship far more code than you write

The naive instinct — "I \`npm install\`ed a popular package, so it's fine" — fails because *popularity is not safety*; the attacker's goal is precisely to compromise something popular. The concrete attack classes:

**Typosquatting.** A malicious package one keystroke from a real one: \`cross-env\` vs \`crossenv\`, \`electron\` vs \`electorn\`, \`lodash\` vs \`loadash\`. You fat-finger an install (or copy a typo'd name from a bad blog) and install malware. Defense: copy names from the official registry page, not from memory.

**Dependency confusion (the subtle, scary one).** Your company has a *private* internal package \`@acme/auth-utils\` from your internal registry. An attacker publishes a package with the *same name* to *public* npm with a higher version. If your package manager checks the public registry too, it may pull the attacker's higher-versioned public package *instead of* your trusted internal one — most resolvers prefer the highest version. This breached Apple, Microsoft, and dozens of others in 2021 with zero social engineering. Defense: scope internal packages, lock the registry per scope (\`@acme:registry=...\`), enable namespace reservation.

**Malicious package / maintainer takeover.** A popular package gets a malicious update — the maintainer's account is phished (\`ua-parser-js\`, \`event-stream\`), or a maintainer hands the keys to a hostile "helpful new contributor," or goes rogue. Suddenly v1.2.4 exfiltrates env vars on install. Defense: pin versions, delay adopting brand-new releases ("cooldown"), review changelogs/diffs of dependency bumps.

**Malicious \`postinstall\` scripts.** npm packages can run arbitrary code *at install time* via \`preinstall\`/\`install\`/\`postinstall\` — the delivery mechanism for most of the above. The payload runs the instant you \`npm install\`, before you ever \`require()\` it, often stealing \`~/.npmrc\` tokens, \`~/.aws/credentials\`, or \`.env\` files. Defense: \`npm config set ignore-scripts true\` where feasible, vet packages that need install scripts, run installs in sandboxed CI with no production secrets.

**Protestware / sabotage.** A maintainer deliberately weaponizes their own widely-used package (\`node-ipc\` wiped files in 2022; \`colors\`/\`faker\` were sabotaged). You inherit the blast radius. Defense: the same pinning + cooldown + review discipline.

### 🎯 Concept: lockfiles, pinning, and the SBOM

**The lockfile (\`package-lock.json\`, etc.) — what it guarantees.** Your \`package.json\` says \`"express": "^4.18.0"\` — the caret means "any 4.x at or above 4.18.0," a *range*, so **two installs on two days can produce two different trees.** The lockfile freezes the exact resolved version *and integrity hash* of every package. The integrity hash (\`sha512-...\`) is the security-critical part: on install, npm verifies the tarball hashes to exactly that value, so a compromised registry serving a tampered tarball makes the install *fail* instead of silently running malware. **Rules:** commit the lockfile, and in CI always use \`npm ci\` (strict, errors on drift), never \`npm install\` (which may *update* the lock).

**Version pinning vs ranges — the real tradeoff.** Pinning exact versions maximizes reproducibility and blocks a surprise malicious minor — but now *you* own applying security patches. Ranges auto-receive patches *and* malice. The mature answer: use a lockfile (pins the resolved tree regardless), allow ranges in \`package.json\`, and use an automated updater (Dependabot/Renovate) that proposes bumps as *reviewed PRs* with a cooldown delay — patches *and* a human review gate, instead of either extreme.

**The SBOM (Software Bill of Materials).** A machine-readable inventory of every component and version — the ingredients list. Two formats: **CycloneDX** and **SPDX**. Why it matters: when a critical CVE drops (Log4Shell, Dec 2021), the first question every org scrambles to answer is *"are we even affected — which of our 300 services use the vulnerable version?"* Teams without an SBOM spent days grepping; teams with one queried the SBOM in minutes. The SBOM turns "are we vulnerable?" from archaeology into a database lookup.

### 🛡️ Defense: a developer's supply-chain hygiene checklist

Root-cause principle: **minimize what you trust, verify what you must trust, and detect when trust is violated.**

- **Minimize:** before adding a dependency, ask "can I write this safely in 20 lines?" (the \`left-pad\` / \`is-odd\` problem — ecosystems shook because a one-line package was unpublished). Prefer fewer, well-maintained deps over many micro-packages.
- **Vet before adding:** check last-publish date, maintainer count, issue health, download trend, and whether it has install scripts. \`npm view <pkg>\` shows maintainers and metadata.
- **Verify integrity:** commit the lockfile; use \`npm ci\` in CI; never disable integrity checking.
- **Pin and cooldown:** let Renovate/Dependabot propose bumps as PRs with a minimum age (e.g. "don't adopt a release younger than 3 days") so a malicious release is likely yanked before you ingest it.
- **Scope internal packages** and bind scopes to internal registries to kill dependency confusion.
- **Disable lifecycle scripts** where you can (\`ignore-scripts\`), and treat any dependency that *requires* a postinstall script as higher-risk.
- **Detect:** run SCA (7.1) continuously, keep an SBOM per release, subscribe to advisory feeds (GitHub Security Advisories, OSV).
- **Protect CI secrets:** never expose powerful tokens to workflows triggered by fork PRs (\`pull_request_target\` runs with secrets *and* checks out untrusted code).

### ⚠️ Common pitfalls and false-confidence traps

- **"It has 10M weekly downloads, so it's safe."** Popularity is the *target*, not a defense — the most damaging attacks hit the most popular packages because the blast radius is largest.
- **Running \`npm install\` in CI instead of \`npm ci\`.** \`install\` can rewrite the lockfile, masking a confusion swap and destroying reproducibility.
- **Adopting releases the day they drop.** Many malicious versions are detected and yanked within hours; a short cooldown converts that risk into someone else's problem.
- **Forgetting transitive deps.** You vetted \`express\`; you didn't vet its 50 transitive dependencies. SCA + SBOM exist precisely because manual vetting doesn't reach the transitive tree.
- **\`pull_request_target\` with secrets.** Runs with repo secrets while checking out the *fork's* untrusted code — a classic CI takeover. Use \`pull_request\` for fork PRs.
- **Treating the SBOM as a one-time deliverable.** Regenerate it on every release and store it with the artifact.

### Real-world case study: Equifax 2017

In 2017 Equifax disclosed a breach of 147 million records. Root cause: an unpatched **Apache Struts2** RCE (CVE-2017-5638) whose patch had been available for two months. Lessons:
- **Why it happened:** no SCA, no inventory of which apps used which versions, no CVE → asset map, no enforced patch SLA. They literally could not answer "which systems run the vulnerable Struts version?" — the exact question an SBOM answers in minutes.
- **Why it was a record breach:** the vulnerable web app sat in front of credit data with no network segmentation; once the attacker had RCE they pivoted to a database with 143M SSNs.
- **Modern fix:** run \`npm audit\` / \`pip-audit\` / \`trivy fs .\` in CI, block on Critical/High, maintain an SBOM per app, map CVE feeds to assets *daily*, and enforce a patch SLA.

### 🎯 Concept: what a secret is, and why "just use an env var" is half a sentence

A **secret** is any value that grants access or proves identity: database passwords, API keys (Stripe, OpenAI, AWS), JWT signing keys, OAuth client secrets, encryption keys, webhook signing secrets. The defining property is that *possession equals power* — whoever holds the Stripe secret key can move money, full stop.

The naive instinct is to hard-code the secret in source. You saw in Module 7.1 why that fails: it ends up in git history forever and gets scraped within minutes. So the universal first improvement is the **environment variable** — the secret lives outside the code, injected by the runtime. Correct and necessary, but only *half* the story:

- **\`.env\` files leak.** That file is plaintext on disk; it gets accidentally committed (the single most common secret leak), copied to laptops, included in Docker images (\`COPY . .\` pulls it in), or printed by a debug endpoint.
- **Env vars are visible to the whole process and its children.** Any code in your process — *including a malicious dependency's postinstall script* — can read \`process.env\` and \`~/.aws/credentials\`. Env vars are a *delivery* mechanism, not an *isolation* mechanism.
- **Env vars don't rotate.** When a key leaks you want to rotate everywhere in seconds; static env vars sprinkled across services make rotation a manual scavenger hunt, so teams *never* rotate, so a single leak stays exploitable for years.
- **Env vars have no audit trail.** You cannot answer "who read the production DB password, and when?"

### 🛡️ Defense: the secrets lifecycle

Root-cause principle: **a secret should exist in exactly two places — the secrets manager, and the running process's memory — and nowhere else, ever.**

1. **Never in source.** Enforced by the gitleaks pre-commit hook + CI scan from Phase 7.
2. **Never in the client bundle.** Secret-bearing operations go through your backend; only truly-public values get client-side env prefixes.
3. **Injected, not stored.** Use a secrets manager that injects at runtime; the app authenticates with a *workload identity* (cloud role), not a bootstrap secret.
4. **Short-lived where possible.** Prefer credentials that expire (STS tokens, dynamic DB credentials from Vault) over static keys.
5. **Rotatable and rotated.** Automate rotation; test it works *before* you need it in an incident.
6. **Audited.** Every secret access is logged, so you can scope an incident.
7. **Different per environment.** Dev, staging, and prod use *different* secrets, so a dev leak never touches prod data.

    body: `> **Why this matters.** Frameworks ship developer-friendly defaults that are *features* in development and *vulnerabilities* in production. Hardening is the deliberate act of flipping those defaults — and security headers are how the *server* instructs the *browser* to enforce protections. The browser is the enforcer; your header is the policy.

### 🎯 Concept: a server in "development mode" is a server with its guard down

**Why verbose errors are a vulnerability (derive it).** A stack trace tells *you* where the bug is. Shown to an attacker, it tells *them* your framework and version (target the right CVE), your file paths and internal structure (map the app), your SQL (craft injection), and sometimes secret values that appear in the error context. The principle is **fail closed and fail quiet**: in production, return a generic error + a correlation ID to the user, and log the full detail server-side where only you can read it.

**Security headers — what each one actually does:**

| Header | What it instructs the browser to do | The attack it blunts |
|---|---|---|
| \`Content-Security-Policy\` | Only load scripts/styles/etc. from these allowed sources | XSS (Module 2): even injected script won't execute if its source isn't allow-listed |
| \`Strict-Transport-Security\` (HSTS) | Always use HTTPS for this site, for N seconds, no exceptions | SSL-strip / downgrade man-in-the-middle on the *next* visit |
| \`X-Content-Type-Options: nosniff\` | Don't guess content types; trust the declared \`Content-Type\` | MIME-sniffing where an uploaded "image" is executed as a script |
| \`Referrer-Policy\` | Limit how much of the URL is sent in the \`Referer\` header to other sites | Leaking session tokens / sensitive paths in URLs to third parties |
| \`Permissions-Policy\` | Disable powerful APIs (camera, geolocation, USB) the page doesn't need | Reduces what injected/3rd-party code can abuse |
| \`Cross-Origin-Opener-Policy\` (COOP) | Isolate your browsing context from cross-origin windows | Cross-window attacks (Spectre-class, tabnabbing) |
| \`Cross-Origin-Resource-Policy\` (CORP) | Control who may embed your resources | Side-channel data leaks across origins |

The single most valuable and most misunderstood is **CSP**, because it is *defense-in-depth for XSS*: even if an attacker injects script, a good CSP can prevent that script from *executing or exfiltrating*. The catch: a CSP with \`unsafe-inline\` allowed for scripts provides almost no XSS protection, because injected inline scripts are exactly what XSS produces. A real CSP uses nonces or hashes and forbids \`unsafe-inline\`.

const app = express();

app.get("/boom", () => { throw new Error("db password is hunter2 at /var/app/db.js:42"); });

\`\`\`javascript
// SECURE baseline
const express = require("express");
const helmet = require("helmet");
const rateLimit = require("express-rate-limit");
const crypto = require("crypto");
const app = express();

app.disable("x-powered-by");                 // WHY: stop free tech-stack disclosure

// per-request CSP nonce so we can forbid unsafe-inline and still allow our own scripts
app.use((req, res, next) => { res.locals.nonce = crypto.randomBytes(16).toString("base64"); next(); });
app.use(helmet({
  contentSecurityPolicy: {
    directives: {
      defaultSrc: ["'self'"],
      scriptSrc: ["'self'", (req, res) => \`'nonce-\${res.locals.nonce}'\`], // WHY: real XSS defense
      objectSrc: ["'none'"],
      baseUri: ["'self'"],
    },
  },
  hsts: { maxAge: 31536000, includeSubDomains: true, preload: true }, // WHY: force HTTPS
}));
// helmet also sets nosniff, Referrer-Policy, COOP, CORP, etc. with sane defaults.

app.use("/auth", rateLimit({ windowMs: 15 * 60 * 1000, max: 20 })); // WHY: blunt credential stuffing

app.get("/", (_req, res) => res.send("hi"));
app.get("/boom", () => { throw new Error("internal detail that must NOT reach the client"); });

// production error handler: generic message + correlation id to client, full detail to logs
app.use((err, _req, res, _next) => {
  const id = crypto.randomUUID();
  console.error(id, err);                    // WHY: full detail server-side only
  res.status(500).json({ error: "Internal error", correlationId: id }); // WHY: quiet to client
});
app.listen(4000);
\`\`\`

\`helmet\` is the Express convention for "set all the security headers sensibly." In Flask the direct counterpart is **flask-talisman**: it sets HSTS, \`nosniff\`, \`Referrer-Policy\`, frame-options, and a CSP in one wrapper — and supports the same **per-request CSP nonce** pattern, the only way CSP is real XSS defense.

import os, uuid
from flask import Flask, g, jsonify
from flask_talisman import Talisman
from flask_limiter import Limiter
from flask_limiter.util import get_remote_address

app = Flask(__name__)

@app.before_request
def set_csp_nonce():
    g.csp_nonce = os.urandom(16).hex()   # WHY: fresh nonce per response = real XSS defense

csp = {
    "default-src": "'self'",
    "script-src": "'self'",              # nonce is appended automatically (see below)
    "object-src": "'none'",
    "base-uri": "'self'",
}
Talisman(
    app,
    content_security_policy=csp,
    content_security_policy_nonce_in=["script-src"],   # WHY: Talisman injects 'nonce-...'
    force_https=True,                    # WHY: redirect http->https + drives HSTS
    strict_transport_security=True,
    strict_transport_security_max_age=31536000,
    strict_transport_security_include_subdomains=True,
)
# Talisman also sets X-Content-Type-Options: nosniff, Referrer-Policy, frame-options, etc.
# In templates, tag your own scripts with the nonce: <script nonce="{{ csp_nonce() }}">

limiter = Limiter(get_remote_address, app=app)

@app.get("/")
def index():
    return "hi"

@app.get("/login", endpoint="login")
@limiter.limit("20 per 15 minutes")      # WHY: blunt credential stuffing on auth routes
def login():
    return "form"

@app.get("/boom")
def boom():
    raise RuntimeError("internal detail that must NOT reach the client")

# production error handler: generic message + correlation id to client, full detail to logs
@app.errorhandler(Exception)
def handle(err):
    cid = str(uuid.uuid4())
    app.logger.exception("unhandled error %s", cid)   # WHY: full detail server-side only
    return jsonify(error="Internal error", correlationId=cid), 500   # WHY: quiet to client

### ⚠️ Pitfalls

- **CSP with \`unsafe-inline\` on scripts.** Near-zero XSS protection — it allows exactly what XSS injects. Use nonces/hashes.
- **Setting HSTS \`preload\` before you're truly HTTPS-everywhere.** Preload is hard to undo.
- **Helmet installed but error handler still leaking.** Headers don't fix verbose errors; you need a production error handler too.
- **Rate-limiting the wrong key.** Behind a CDN/load balancer, set \`trust proxy\` and key on the real client IP, not the proxy.

### 🎯 Concept: in the cloud, identity is the perimeter

**IAM — Identity and Access Management** is the cloud's permission system: every action (\`s3:GetObject\`, \`rds:Connect\`) by every principal (a user, or a *workload role* attached to your server/function) is allowed or denied by policy.

**The principle of least privilege, made concrete.** A workload role should be able to do *exactly* what that workload needs and nothing more. The image-upload service needs \`s3:PutObject\` on *one* bucket prefix — not \`s3:*\` on \`*\`. The naive instinct ("give it admin so it just works, lock down later") fails because "later" never comes, and now a single SSRF or RCE in that service grants the attacker your entire account. Least privilege is what *bounds the blast radius* of every other bug in this course.

**Network exposure.** A database should be reachable only from your application's network, never from the public internet. The classic catastrophe is a Postgres/Mongo/Redis/Elasticsearch instance bound to \`0.0.0.0\` with a weak password, indexed by Shodan, and ransomed within hours. Fix: bind to private subnets, use security-group rules that allow only the app's source, and require auth + TLS even on the private network.

### 🛡️ Defense: cloud posture checklist (root-cause oriented)

- **Least-privilege IAM.** Scope every workload role to specific actions on specific resource ARNs with conditions. No \`*:*\`. This bounds the blast radius of *every* other vulnerability.
- **IMDSv2 required.** \`HttpTokens: required\` on every instance breaks the simplest SSRF-to-credentials path. Verify your Terraform/CDK actually sets it.
- **SSRF egress filtering.** Every code path that fetches a user-influenced URL must block link-local + private ranges *by resolved IP*, restrict schemes to http/https, ideally use an allow-list.
- **Private databases.** No database on a public IP. Private subnet + security group scoped to the app + auth + TLS.
- **Block public object storage by default.** Enable account-level "block public access"; serve user files via signed, time-limited URLs.
- **Detection.** CloudTrail/audit logs + GuardDuty-style anomaly detection: a role used from outside its normal VPC, or sudden mass \`GetObject\`, is a credential-theft signal.
- **SSRF unit tests.** For every URL-fetching path, assert that \`169.254.169.254\` and \`127.0.0.1\` are rejected — so a refactor can't silently reintroduce the hole.

### ⚠️ Pitfalls

- **"Lock it down later."** The temporary admin role becomes permanent. Start least-privilege and *add* permissions when something breaks.
- **Filtering SSRF by hostname string.** Bypassed by DNS that resolves to an internal IP. Filter the resolved IP, re-check at connect time.
- **IMDSv2 assumed, never verified.** Many "secure by default" templates still allow IMDSv1; confirm \`HttpTokens: required\`.
- **Public bucket "just for now."** Indexed by scanners in hours. Default to private + signed URLs.
- **Over-trusting the private network.** Require auth even internally — an SSRF or lateral move can put an attacker *on* the internal network.

### 🎯 Concept: logs are for the incident you can't predict yet

A log is an append-only record of events. *Application* logs exist to debug functionality. *Security* logs exist to answer forensic and detective questions: *who* did *what*, *when*, *from where*, and *did it succeed?* The naive instinct — "I'll add logging when I have a problem" — fails because **you cannot log the past.** When you discover a breach, the only evidence you have is what you were *already* recording. Logging is insurance.

**The two questions every security log entry must let you answer:**

1. **Detection:** can a human or rule notice "this pattern is an attack"? (e.g., 500 failed logins for one account in a minute = credential stuffing.)
2. **Investigation:** after the fact, can you reconstruct the attacker's path and scope the damage? ("this token was used from 40 IPs across 6 countries in an hour" → account takeover.)

**What to log (and *why each one*):**

- **Authentication events** — login success *and* failure, with username, source IP, user-agent, timestamp. (Failures detect brute force; successes detect "logged in from a new country.")
- **Password reset and MFA changes** — requested and completed. (Attackers reset passwords and disable MFA to take over accounts; highest-signal ATO events.)
- **Authorization decisions, especially *denials*** — "user 7 was denied access to org 9's invoice." (A burst of denials is someone probing for IDOR/broken access control — often the *only* signal of an enumeration attack.)
- **Role/permission/privilege changes** — who granted what to whom.
- **Sensitive/admin actions** — data exports, bulk deletes, refunds, config changes. (These are what an attacker *wants*; logging them gives you the blast-radius map.)
- **Rate-limit and validation rejections** — sudden spikes are reconnaissance.
- **Webhook and file-upload failures** — common abuse and injection vectors.

**What you must NEVER log (this is itself a vulnerability class):**

- **Passwords** (even "wrong" attempted ones — users mistype their *real* password into the username field constantly; your log becomes a plaintext password trove).
- **Full session tokens, JWTs, API keys** (a log reader, or a leaked log, becomes instant account access — log a *prefix* or a hash if you must correlate).
- **Full credit-card numbers, CVVs** (PCI-DSS violation; log a last-4 if needed).
- **Sensitive personal data** (health, government IDs) **unless required, minimized, and access-controlled** (GDPR/CCPA data-minimization).

The core principle: **logs leak.** They're copied to aggregators, shipped to third-party SaaS, read by on-call engineers, and sometimes exposed by *their own* bugs. "Log enough to investigate, never enough to harm" — which is why you log a token's *hash or prefix*, not the token.

### 🎯 Concept: structured logs and the trace ID

A log line like \`User login failed\` is nearly useless. **Structured logging** emits each event as a JSON object with consistent fields, so logs become *queryable data*:

### 🛡️ Defense: a logging architecture that survives an incident

- **Log security events as structured JSON** with a stable event taxonomy (\`auth.login.failure\`, \`authz.denied\`, \`admin.export\`).
- **Centralize and ship logs off the box** to an aggregator (the attacker who compromises a server *will* try to wipe its local logs).
- **Make logs tamper-evident/immutable** where it matters (write-once storage, restricted delete permissions).
- **Set retention deliberately** — long enough to investigate, bounded by privacy law and storage cost.
- **Redact at the source.** Hash/truncate tokens and PII *before* they hit the log.
- **Time-sync everything (NTP, UTC).** Correlating across services is impossible if clocks disagree.

    def format(self, record):
        payload = {
            "ts": self.formatTime(record, "%Y-%m-%dT%H:%M:%S%z"),
            "level": record.levelname.lower(),
            "event": getattr(record, "event", record.getMessage()),
        }
        for k in ("email_hash", "ip", "ua", "trace_id", "user_id"):
            if hasattr(record, k):
                payload[k] = getattr(record, k)
        return json.dumps(payload)   # WHY: one JSON object per line = queryable data

        "ip": ip, "ua": ua, "trace_id": trace_id,
    })                                       # WHY: no password, no raw email/token; detectable

    body: `> **Why this matters.** During a live incident you are stressed, possibly at 3 a.m., possibly being actively attacked — and your judgment is degraded exactly when the stakes are highest. A playbook is a pre-made decision so your panicking future self doesn't have to invent the right move under pressure.

### 🎯 Concept: decisions made in advance, because incidents destroy judgment

An **incident** is a confirmed or suspected security event with potential impact — a leaked secret, an account takeover, an exploited vulnerability. **Incident Response (IR)** is the structured process of handling it.

**The canonical IR lifecycle (NIST-style):**

1. **Preparation** — everything *before* an incident: the logging (9.1), the alerts (9.2), the playbooks, the contact list, the access to rotate secrets. You're doing it right now.
2. **Detection & Analysis** — you got the alert. Confirm it's real, assess severity, scope it: what's affected, how bad, is it ongoing?
3. **Containment** — stop the bleeding *without destroying evidence*. Short-term (revoke the token, disable the account, block the IP) vs. long-term (rotate all related secrets, isolate the host).
4. **Eradication** — remove the root cause (patch the vuln, kill persistence, close the misconfiguration).
5. **Recovery** — restore normal service, verify the attacker is gone, watch closely for re-entry.
6. **Post-incident (lessons learned)** — a **blameless postmortem**: what happened, why, what we'll change so it can't recur. *Blameless* because if people fear punishment they hide incidents, the worst possible outcome.

**Two critical, counter-intuitive rules beginners get wrong:**

- **Contain before you erase — preserve evidence first.** The panicked instinct is to \`rm\` the webshell and reimage the box immediately. But you've just destroyed the forensic evidence you need to learn *how they got in* and *what they took* — so you'll likely be breached the same way again. Snapshot/preserve first, then contain.
- **Rotate, don't just delete.** Revoke and reissue credentials/tokens; assume anything the attacker *could* have touched *was* touched.

**Every playbook answers the same six questions** (write them as a fill-in-the-blank template): How do we **detect** it? How do we **contain** it (without destroying evidence)? How do we **investigate scope**? How do we **recover**? **Who** gets notified (including legal/regulatory — many jurisdictions have breach-notification deadlines)? What do we **improve** afterward?

2. CONTAIN (preserve evidence first)
   - Snapshot the relevant logs NOW (they may rotate out).
   - Invalidate ALL active sessions for the account (force re-auth) — not just the

4. RECOVER

5. NOTIFY
   - The affected user. Security lead. If customer data was accessed: legal /
     privacy (breach-notification deadlines may apply — e.g., GDPR 72h).

6. IMPROVE
   - Was MFA enforced? Was the new-country alert fast enough? Did session

/* =========================================================================
   SIMPLE MARKDOWN-ISH RENDERER
   Handles: ### headings, **bold**, `inline code`, ```fenced code```, - lists, paragraphs
   ========================================================================= */

function renderProse(text) {
  if (!text) return null;
  const lines = text.split("\n");
  const blocks = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // Fenced code block
    if (line.startsWith("```")) {
      const lang = line.slice(3).trim();
      const codeLines = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) {
        codeLines.push(lines[i]);
        i++;
      }
      i++;
      blocks.push({
        type: "code",
        lang,
        content: codeLines.join("\n")
      });
      continue;
    }
    // Details / summary block:  <details><summary>Title</summary> ... </details>
    if (line.trim().startsWith("<details")) {
      let summary = "";
      const innerLines = [];
      i++;
      // capture optional <summary>...</summary>
      while (i < lines.length && !lines[i].trim().startsWith("</details")) {
        const t = lines[i].trim();
        const sm = t.match(/^<summary>([\s\S]*?)<\/summary>$/);
        if (sm) {
          summary = sm[1].replace(/<\/?strong>/g, "").trim();
        } else {
          innerLines.push(lines[i]);
        }
        i++;
      }
      i++; // skip closing </details>
      blocks.push({
        type: "details",
        summary: summary || "Reveal",
        inner: renderProse(innerLines.join("\n"))
      });
      continue;
    }
    // Heading h4
    if (line.startsWith("#### ")) {
      blocks.push({
        type: "h4",
        content: line.slice(5)
      });
      i++;
      continue;
    }
    // Heading h3
    if (line.startsWith("### ")) {
      blocks.push({
        type: "h3",
        content: line.slice(4)
      });
      i++;
      continue;
    }
    // Blockquote
    if (line.startsWith("> ")) {
      const qLines = [];
      while (i < lines.length && (lines[i].startsWith("> ") || lines[i].trim() === ">")) {
        qLines.push(lines[i].replace(/^>\s?/, ""));
        i++;
      }
      blocks.push({
        type: "blockquote",
        inner: renderProse(qLines.join("\n"))
      });
      continue;
    }
    // Table:  | a | b |  followed by  | --- | --- |
    if (line.trim().startsWith("|") && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const splitRow = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
      const header = splitRow(lines[i]);
      i += 2; // skip header + separator
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) {
        rows.push(splitRow(lines[i]));
        i++;
      }
      blocks.push({
        type: "table",
        header,
        rows
      });
      continue;
    }
    // Ordered list
    if (/^\d+\.\s/.test(line)) {
