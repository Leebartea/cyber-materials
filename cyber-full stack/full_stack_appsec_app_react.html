/* =========================================================================
   FULL-STACK APPSEC CURRICULUM DATA  (React data-model port)

   Schema per module:

   - phaseId groups modules under a collapsible phase header in the sidebar.

   (+7.5) and the 4 capstones. Source of truth: full_stack_appsec_curriculum.md.
   ========================================================================= */

const curriculum = {
  title: "Full-Stack AppSec",
  subtitle: "Web-first application security for full-stack developers · Mac M2 Pro",
  // Phases mirror Cyber Guardians' "levels": each gets a collapsible sidebar group.
  phases: [{
    id: "p0",
    name: "Phase 0 · Computer, Web, Code & Terminal Basics",
    short: "Phase 0 · Foundations",
    tagline: "First-principles foundation, viewed through a threat lens",
    colorVar: "--l1",
    weeks: "1–2 weeks"
  }, {
    id: "p1",
    name: "Phase 1 · Web, Internet & CLI Foundations",
    short: "Phase 1 · Web & CLI",
    tagline: "The protocols (HTTP/DNS/TLS) and tools security rides on",
    colorVar: "--l2",
    weeks: "2–3 weeks"
  }],
  modules: [
  // ============== PHASE 0 ==============
  {
    id: "m0-1",
    phaseId: "p0",
    num: "0.1",
    title: "How Your Computer Works",
    objective: "Every vulnerability is, underneath, a thing happening on a real computer. Make the machine stop being a black box, and security stops being memorized trivia — you start to see where the trust boundaries are.",
    body: `> **Why this module is first.** Every vulnerability you will ever exploit or fix is, underneath, a thing happening on a real computer: a process reading memory it shouldn't, a file with permissions that are too loose, a program trusting input it should have checked. If the machine is a black box to you, security will feel like memorized trivia. Once the machine is *not* a black box, security becomes obvious — you start to *see* where the trust boundaries are.

### 🎯 Concept: the four things a computer does, and the trust boundary in each

A computer, stripped to its essence, does four things: it **computes** (CPU), it **remembers temporarily** (memory/RAM), it **remembers permanently** (disk/storage), and it **talks to other computers** (the network). Everything else — your browser, your editor, your database — is built on those four.

Let us define each precisely, because the security questions live inside the definitions.

**The CPU (Central Processing Unit)** is the part that actually *runs instructions*. A program is just a list of instructions; the CPU reads them one after another and does what they say. The crucial security fact: the CPU will faithfully run whatever instructions it is handed. It has no opinion about whether those instructions are *yours* or an *attacker's*. This is the deepest root of an entire vulnerability class — if an attacker can get their data treated as *instructions* (this is what "injection" and "code execution" mean), the CPU happily runs it. Hold that thought; it returns in Phase 3 (SQL injection) and Phase 4 (command injection).

**Memory (RAM, Random Access Memory)** is fast, temporary storage that holds the data a running program is actively using. When you close a program or power off, RAM is wiped. Security fact: secrets a program is using — passwords being checked, decryption keys, session tokens — live in RAM while in use. Anything that can read another program's memory can steal those secrets. The operating system's job is to *isolate* each program's memory so one program cannot read another's. When that isolation fails, you get memory-disclosure bugs.

**Disk (storage / SSD)** is slower, permanent storage: files, your database's data, your application's code. Security fact: data on disk persists, which means a leaked backup, a stolen laptop, or a misconfigured cloud bucket exposes *everything stored*, long after the moment it was written. This is precisely why Phase 6 obsesses over never storing plaintext passwords — disk is forever, and disk gets copied.

**The network card (NIC)** sends and receives data over the network. Security fact: anything sent over the network can, in principle, be observed or modified by anyone on the path between the two machines — *unless it is encrypted*. This is the entire reason HTTPS/TLS exists (Module 1.2).

Sitting on top of the hardware is the **operating system (OS)** — on your Mac, macOS. The OS is the referee. It decides which program gets the CPU, it hands out and protects memory, it controls who can read or write each file, and it mediates network access. Three OS concepts are load-bearing for security:

- **Files and folders.** Everything you build or run lives somewhere as a file. A file has *contents* and *metadata* (owner, permissions, timestamps). The path (e.g. \`/Users/you/project/.env\`) is its address.
- **Processes.** A *process* is a running program — an instance of code the CPU is executing, with its own slice of memory. Your browser is a process (often many). Your Node server is a process.
- **Permissions.** The OS attaches rules to files and processes: *who* (which user) may *read*, *write*, or *execute* each thing. This is the OS implementing the **principle of least privilege** — the idea that any actor should have *only* the access it needs and no more.

**The mental model, made precise.** The OS is the *government and police* (it enforces rules and can be corrupted or bypassed); files are *property* (each has an owner and access rules); processes are *people doing jobs*; permissions are *keys and badges*; the network is the *roads and mail* (open to observation unless you seal the envelope). An attacker is someone trying to get a key they were never issued, read mail that wasn't theirs, or get the police to act on a forged order.

### ⚔️ Hands-on: inspect your own machine through a trust lens

> **Ethics & scope (read every time).** Everything in this module runs against **your own Mac**, inspecting **your own** files and processes. These commands only *read* information about your machine — they change nothing. Never run inspection or enumeration commands against a computer you do not own or have written permission to examine.

Open the Terminal app (press ⌘-Space, type "Terminal", Enter) and run these one at a time. After each, read the explanation — the goal is not to run commands but to *understand what each reveals*.

\`\`\`bash
pwd          # "print working directory" — where you are in the filesystem right now
ls           # list the files in the current directory
ls -la       # list ALL files (including hidden dotfiles) with permissions, owner, size
whoami        # which user account is running these commands
id            # your user id, group ids — your "badge" the OS checks for permissions
ps aux | head # the processes currently running, who owns them, what they are
\`\`\`

**What to actually look at:**

- In \`ls -la\`, the first column looks like \`-rw-r--r--\`. That string *is* the permission rules. The first character is the type (\`-\` file, \`d\` directory). The next nine are three groups of \`rwx\` (read/write/execute) for **owner**, **group**, and **everyone else**. So \`-rw-r--r--\` means "owner can read+write; group and everyone can only read." This is least privilege written down on every file you own.
- Notice files starting with \`.\` (like \`.zshrc\`, and later \`.env\`). The leading dot makes them *hidden* from plain \`ls\` — a convention, **not** a security control. A hidden file is just as readable as any other to anyone with permission.
- \`whoami\` / \`id\` tell you the identity the OS uses for every permission check you trigger. When you later read about an attacker "escalating privileges," they are trying to make \`id\` say something more powerful than it should.
- \`ps aux\` shows every running process and its owner. The security question: *why should a random app you downloaded run as a powerful user?* It usually shouldn't — that's least privilege for processes.

### 🛡️ Defense: the principles you just met, named

You haven't written a defense yet, but you have met the principles that *every* later defense is built on:

- **Least privilege** — give every user, process, and credential the minimum access it needs.
- **Isolation** — keep one thing's failure from becoming everything's failure.
- **Trust boundaries** — the line between something you control and something you don't.
- **Persistence of data** — anything on disk can be copied and outlive the moment; design as if every stored secret will eventually leak.

### 🎯 Concept: how one machine reaches another, step by step

When you type \`example.com\` and press Enter, a surprisingly long chain of trust steps fires. Let's define each piece, then walk the chain.

- **Your device** — your laptop or phone, the *client* that originates the request.
- **The router** — the box that connects your local network to the wider internet.
- **IP address** — the actual *numeric address* of a machine on the network, like \`93.184.216.34\` (IPv4). Routing only works on IP addresses. Names are for humans; the network moves packets by IP.
- **Domain name** — a human-friendly name like \`example.com\`.
- **DNS (Domain Name System)** — the internet's address book. It translates a domain name into the IP address(es) behind it.
- **Server** — a computer that *listens* for requests and *responds* (usually on port 443 for HTTPS).
- **Client** — the thing that *initiates* a request (your browser, a mobile app, \`curl\`).

**The chain, walked:** (1) Your browser needs the IP for \`example.com\`. (2) It asks a DNS resolver, which returns an IP. (3) Your browser opens a connection to that IP, on the right port, through your router and across the internet. (4) It sends an HTTP request. (5) The server responds. (6) Your browser renders the response.

**Where trust is assumed — and therefore where attacks live:**

- **At the DNS step**, your browser *trusts* that the resolver's answer is correct. If an attacker can make DNS return the *wrong* IP (DNS spoofing/cache poisoning), your browser connects to the attacker's server while still showing \`example.com\` in the address bar. This is why a name alone proves nothing — and why TLS certificates (Module 1.2) exist to *prove* the server you reached is really the one for that name.
- **On the road between you and the server**, every machine on the path can see your packets. If the connection is plain HTTP, they can read and modify everything (a *man-in-the-middle*). Encryption (HTTPS) is what seals the envelope.
- **At the server**, the server must decide *who is allowed to do what*. The network got your request *to* the server; it says nothing about whether you're *allowed* to do what you asked.

### 🎯 Concept: the three languages, the DOM, and the inspector

### 🎯 Concept: a backend is a decision-maker that owns the data

A **backend** (server-side application) is a program that **receives requests, applies rules, talks to data stores, and returns responses.** Break that into its security-relevant duties:

- **It receives requests** over HTTP. Each request is just bytes the client sent — fully attacker-controllable, as you proved in 0.3.

**Why is the backend "more trusted" than the frontend?** Not because the code is better, but because of *who controls the execution environment*. The frontend runs on the user's machine, fully under their control. The backend runs on *your* server, which the user cannot inspect, edit, or run arbitrary code on. So the backend is the only component whose decisions the user cannot tamper with.

**The recurring failure mode:** the backend assumes the request reflects something the *frontend* guaranteed. "The UI only shows the delete button to admins, so any delete request must be from an admin." False — the attacker sends the delete request directly. The backend must independently verify *every* security-relevant fact on every request, treating the frontend as if it doesn't exist.

- **Postgres (PostgreSQL)** is a powerful, free, widely used relational database and a fine default for full-stack work.

A simple query:

\`\`\`sql
SELECT id, email FROM users WHERE email = 'ada@example.com';
\`\`\`

Read it as: "from the \`users\` table, give me the \`id\` and \`email\` columns, for rows where \`email\` equals \`ada@example.com\`."

Now the two security ideas, derived rather than asserted:

    body: `> **Why this matters.** Nearly every security tool you'll use — \`nmap\`, \`sqlmap\`, \`gitleaks\`, \`hashcat\`, Docker — is driven from the terminal. Fear of the terminal becomes fear of the tools, which becomes fear of the field. This module makes the terminal *boring* (the good kind), and teaches the few commands that can actually hurt you so you respect them rather than fear all of them.

### 🎯 Concept: a precise model of what a command is

A **terminal** (or shell — on your Mac the default is \`zsh\`) is a program that reads text commands, runs them, and shows their output. A command has three parts:

- **The command name** — *what* to run (\`ls\`, \`curl\`, \`git\`).
- **Options / flags** — *how* to run it, usually starting with \`-\` or \`--\` (\`ls -l\`, \`curl --verbose\`).
- **Arguments** — *what to run it on* (\`ls /Users\`, \`cat notes.txt\`).

So \`ls -la /Users/you\` = "list (\`ls\`), in long+all mode (\`-la\`), the directory \`/Users/you\`."

Two more concepts you must hold:

- **The current directory matters.** Commands run *relative to where you are* (shown by \`pwd\`). Many beginner mistakes are just "I ran it in the wrong directory."
- **Some commands only read; others change things.** \`ls\`, \`cat\`, \`pwd\`, \`dig\` are *read-only*. \`rm\`, \`mv\`, \`chmod\`, \`>\` *modify* state. The single most valuable terminal habit is knowing, before you press Enter, which kind a command is.

**Pipes and redirects:**
- A **pipe** \`|\` sends one command's output into another's input: \`ps aux | head\`.

echo "again" >> note.txt  # append a second line

### 🎯 Concept: the anatomy of a request and a response

**HTTP (HyperText Transfer Protocol)** is a simple text-based request/response protocol. A client sends a *request*; a server returns a *response*. Both have the same shape: a first line, a set of headers, a blank line, then an optional body.

A **request** looks like this (literally the bytes sent):

\`\`\`
POST /api/login HTTP/1.1          ← request line: METHOD  PATH  VERSION
Host: example.com                 ← headers: key: value, one per line
Content-Type: application/json
Content-Length: 44
Cookie: session=abc123

{"email":"ada@example.com","password":"x"}   ← body (after the blank line)
\`\`\`

- **Request line** = **method** + **path** + **version**.
- **Headers** are metadata key/value pairs. **Every header is set by the client and therefore attacker-controllable.**
- A **blank line** separates headers from body.
- The **body** carries data (form fields, JSON).

A **response** has the same shape with a *status line* instead:

\`\`\`
HTTP/1.1 200 OK                   ← status line: VERSION  CODE  REASON
Content-Type: text/html
Set-Cookie: session=abc123; HttpOnly; Secure; SameSite=Lax

<html>...</html>                  ← body
\`\`\`

**HTTP methods** declare intent (and the intent matters for security):
- **GET** — *read* a resource; should have **no side effects** (state-changing GETs enable CSRF via simple links).
- **POST** — *create* / submit data, with side effects.
- **PUT** — *replace*; **PATCH** — *partially update*; **DELETE** — *remove*.
- **OPTIONS** — *ask what's allowed* (CORS preflight — Module 2.4).

**Status codes** are three digits grouped by leading digit:
- **2xx success** — \`200 OK\`, \`201 Created\`, \`204 No Content\`.
- **3xx redirection** — \`301\`/\`302\` (the \`Location\` header says where). A vuln class when the target is attacker-controlled — *open redirect*.
- **4xx client error** — \`400\`, \`401 Unauthorized\` (not authenticated), \`403 Forbidden\` (authenticated but not allowed), \`404\`, \`429 Too Many Requests\`. The \`401\` vs \`403\` distinction maps onto authentication vs authorization.
- **5xx server error** — \`500\`, \`502\`, \`503\`. A verbose \`500\` leaking a stack trace or SQL error is an information-disclosure bug.

**Content types** (the \`Content-Type\` header) tell the receiver how to parse the body: \`text/html\`, \`application/json\`, \`application/x-www-form-urlencoded\`, \`multipart/form-data\` (file uploads).

**Caching headers** (\`Cache-Control\`, \`ETag\`): if a *private*, per-user response is marked cacheable, a shared cache can serve one user's data to another. Mark authenticated responses \`Cache-Control: no-store\`.

**Redirects** deserve their own callout. \`302\` + \`Location: <whatever the user put in ?next=>\` is an **open redirect**: an attacker crafts \`https://yoursite.com/login?next=https://evil.com\`, the victim trusts \`yoursite.com\`, and gets bounced to the attacker's lookalike. Always validate redirect targets against an allow-list.

### 🛡️ Defense: treat every part of the request as hostile, honor method semantics

- **Validate all client input** — body, query, path params, *and headers and cookies*.

### 🎯 Concept: how a name resolves, and how a connection is secured

**DNS record types you must recognize** (DNS is a database of records attached to names):
- **A** — maps a name to an **IPv4** address. **AAAA** — maps to an **IPv6** address.
- **CNAME** — an *alias*: "this name is really that other name." (\`www.example.com\` → \`example.com\`.) Central to subdomain-takeover bugs below.
- **MX** — mail servers for the domain.
- **TXT** — arbitrary text records, used for domain verification, SPF/DKIM, and ownership proofs. Security-relevant because TXT records often *grant trust* to third parties.

**Subdomain takeover — a DNS bug you'll cause if you're not careful.** Suppose you point \`shop.yoursite.com\` via CNAME at a hosting provider (\`shop.someprovider.io\`), then later stop using that provider *without deleting the DNS record*. The CNAME now dangles. An attacker registers that name on the provider, and now *they* control \`shop.yoursite.com\`, serving content under your trusted domain (great for phishing, cookie theft). **Root cause: a DNS record outliving the resource it pointed to.** Defense: delete DNS records when you decommission the thing they point to.

**TLS (Transport Layer Security)** turns plain HTTP into **HTTPS**. It does three things at once:
- **Encryption** — nobody on the path can read the contents.
- **Integrity** — nobody can silently modify the contents (tampering is detected).
- **Authentication** — the server *proves it is who the name says it is*, via a **certificate**.

**HSTS (HTTP Strict Transport Security)** is a response header (\`Strict-Transport-Security\`) that tells the browser "for the next N seconds, *only* ever talk to me over HTTPS." It closes the gap where a user's first request (typing \`example.com\` without \`https://\`) goes out as plain HTTP and can be hijacked before the redirect.

**Mixed content** is when an HTTPS page loads sub-resources over plain HTTP. The page looks secure, but those HTTP resources are unencrypted and tamperable — an attacker can replace an HTTP-loaded script and run code on your "secure" page.

- **\`grep\`** searches *file contents* for a pattern. **\`rg\` (ripgrep)** is a faster, smarter grep that respects \`.gitignore\` and is the modern default.

### 🎯 Concept: Git's history model and why it makes secret leaks permanent

**Git** is a version-control system: it records snapshots of your project over time. The pieces:
- A **commit** is a saved snapshot with a message, author, and a link to its parent — together they form the project's history.
- A **branch** is a movable pointer to a line of commits.
- A **pull request (PR)** is a proposal to merge one branch into another, where review and automated checks run.
- **\`.gitignore\`** is a file listing paths Git should *never track* — your \`.env\`, \`node_modules\`, build artifacts, anything secret or generated.
- **GitHub** is a hosting service for Git repositories.

**The history insight that makes this a security topic:** a commit is *immutable and permanent by design*. When you \`git add\` a file, Git records its exact contents into history. If that file contained a secret, the secret is now embedded in that commit forever. Committing a *new* version with the secret removed adds a *new* snapshot — but the old commit, with the live secret, is still in the history and is pushed to GitHub. **Therefore: a secret committed to a repo must be considered compromised — rotate it (issue a new one and revoke the old) — even after you "delete" it.** Cleaning history (\`git filter-repo\` or BFG) is possible but disruptive and *still* assumes the secret was exposed in the meantime.

**GitHub's security features you should turn on:**
- **Secret scanning** — GitHub automatically scans pushes for known secret formats and alerts you (and, for many providers, the provider itself, who may auto-revoke).

- **Malware** — *mal*icious soft*ware*: any program written to act against the device owner's interest. The categories below combine in real samples.

| Type | What it does | Famous example |
|---|---|---|
| Virus | Attaches to a file; spreads when the file is executed | ILOVEYOU (2000) |
| Worm | Self-propagates over networks with **no user action** | WannaCry (2017) |
| Trojan | Looks legitimate, carries a hidden payload | Zeus banking trojan |
| Ransomware | Encrypts files, demands payment for the key | WannaCry, LockBit |
| Spyware | Silently monitors the user | Pegasus |
| Rootkit | Hides deep in the OS for persistent access | Stuxnet |
| Adware | Unwanted ads and tracking | Superfish (Lenovo, 2015) |
| Botnet node | Your device enslaved into an attacker's army | Mirai |
| Fileless | Lives only in memory; no file on disk to scan | Poweliks |

The key distinction: a **worm needs no human** (it exploits a network hole and spreads itself — WannaCry crossed the planet in hours), while a **virus needs a human** to run the infected file. So patching stops worms; user training stops viruses and phishing.

1. **Authority** — 'This is IT, we need your password to fix a problem.'
2. **Urgency** — 'Your account will be closed in 1 hour.' (Time pressure suppresses careful thought.)
3. **Scarcity** — 'Only 3 seats left.' (Fear of missing out.)

function handleInboundEmail(msg) {

  // SPF proves the IP is authorized; DMARC ties them to the visible From.
  const ok = res.dmarc?.status?.result === "pass" &&

    theory: `#### Define the words first

- **Browser fingerprint** — the combination of observable traits (User-Agent, fonts, resolution, time zone, WebGL/canvas render quirks) that identify you *without* a cookie.
- **Cookie** — a key/value the server asks the browser to store and resend. **First-party** = set by the site you're on (login session). **Third-party** = set by an embedded different domain (ad network) to track you across sites.
- **VPN** — an encrypted tunnel to a provider's server, which talks to the internet for you. It moves trust from your local network to the VPN provider.
- **Tor** — onion routing through three relays so no single node sees both who you are and what you visit.
- **Cookie flags** — server-set attributes (\`Secure\`, \`HttpOnly\`, \`SameSite\`) that constrain a cookie; the developer's main privacy/security lever.

#### What your browser reveals without asking

User-Agent, IP, installed fonts, resolution, time zone, language, and a **canvas/WebGL fingerprint** (how your exact GPU+drivers render a hidden image). Combined, often unique enough to single you out *even with cookies cleared and incognito on* — which is why deleting cookies is not the whole answer.

#### Why the naive privacy tools under-deliver

> **Naive #1: "Incognito makes me invisible."** Fails because incognito only stops your *local* browser from saving history/cookies after the window closes. Websites, ISP, employer, school, and DNS still see every request live.

> **Naive #2: "A VPN makes me anonymous."** Fails because it only moves trust: the VPN provider now sees everything, and logged-in accounts identify you by *account*, not IP. It's confidentiality on untrusted networks, not anonymity.

> **Naive #3: "I block third-party cookies, so I can't be tracked."** Fails because **fingerprinting needs no cookie** and survives clearing/private mode. Defense needs fingerprint *resistance*, not just cookie hygiene.

> **The correct posture:** match tool to threat — HTTPS+VPN on untrusted Wi-Fi (confidentiality), tracker/fingerprint blocking for ad surveillance, Tor + compartmentalization for true anonymity. No single switch.

#### What a VPN actually does

| ✅ Does | ❌ Does not |
|---|---|
| Hides your IP from websites | Make you anonymous (provider sees all) |
| Hides activity from ISP / school Wi-Fi | Protect against malware or phishing |
| Lets you appear in another region | Matter if you're logged into Google anyway |

#### What Tor actually does

Three random relays: entry knows you but not the destination; exit knows the destination but not you; no node sees both. Legal in most countries, slower by design.

#### The developer's role in privacy

When *you* build a site, your cookie flags decide whether a session can be stolen or tracked: \`Secure\` (HTTPS-only), \`HttpOnly\` (JS can't read it — blunts XSS theft), \`SameSite\` (controls cross-site sending — front-line CSRF/tracking control). Same three flags in every language because they're an HTTP standard.

  secret: process.env.SESSION_SECRET,
  cookie: {
    secure: true,      // only over HTTPS
    httpOnly: true,    // JS can't read it -> XSS can't steal the session
    sameSite: "lax"    // not sent on cross-site POSTs -> blunts CSRF/tracking
  }
}));

- **File permissions** — Unix access control: read/write/execute bits for **owner / group / others**, written as three octal digits (\`600\` = owner read+write, nobody else; \`644\` = owner rw, everyone read).
- **\`chmod\` / \`chown\`** — change a file's permission bits / change its owner.

#### Why permissions are a security control (the naive mistake)

> **Naive: "It's my laptop, permissions don't matter."** Fails because the moment a file holds a secret — an SSH key, an API token, a \`.env\` — its permission bits decide which user *or process* can read it. A world-readable secret (\`644\`) is readable by every account and many services. SSH even REFUSES a private key that is group/world-readable. Correct posture: secrets are \`600\`, and code sets that mode AT creation.

#### The pipe model in one line

\`command A | command B\` = "run A, feed its output to B." \`ps aux | grep node | wc -l\` lists processes, keeps node ones, counts them. Each stage narrows the data.

\`\`\`javascript

// Node - SECURE: create owner-only (0600) at write time
require("fs").writeFileSync(".env", "API_KEY=sk_live_123", { mode: 0o600 });
// WHY IT WORKS: owner-only from creation, so the secret is never momentarily
// world-readable. Setting mode AT creation avoids the chmod-after-write race.
\`\`\`

- **Protocol** — agreed rules for exchanging data (HTTP, TCP, DNS).

- **Port** — a numbered endpoint (0–65535) identifying WHICH service a connection is for. The IP finds the machine; the port finds the program.
- **Listening / bound** — a service is listening when it accepts connections on a port. The **bind address** decides WHO can reach it: \`127.0.0.1\` (localhost only) vs \`0.0.0.0\` (every interface — the whole network).

#### The OSI 7-layer model — "Please Do Not Throw Sausage Pizza Away"

| # | Layer | Does | Example |
|---|---|---|---|
| 7 | Application | User-facing protocols | HTTP, DNS, SSH |
| 6 | Presentation | Format, encrypt | TLS, JPEG |
| 5 | Session | Keep conversations alive | Login sessions |
| 4 | Transport | Reliable/unreliable delivery | TCP, UDP |
| 3 | Network | Routing between networks | IP, ICMP |
| 2 | Data Link | Local delivery | Ethernet, MAC |
| 1 | Physical | Bits on wire/radio | Cables, Wi-Fi |

Every control and attack lives at a layer: firewalls filter at L3/L4, TLS protects L6, SQL injection is an L7 problem no port-rule can stop. The layer tells you which defense applies.

#### TCP vs UDP

- **TCP** — reliable, ordered, acknowledged. The 'phone call'. Web, email, SSH.
- **UDP** — fast, fire-and-forget, no guarantees. The 'postcard'. DNS, video, games.

#### Ports you must know cold

| Port | Service | Why |
|---|---|---|
| 22 | SSH | Remote secure login |
| 23 | Telnet | **No encryption — dead** |
| 53 | DNS | Name resolution (mostly UDP) |
| 80 / 443 | HTTP / HTTPS | Web (unencrypted / encrypted) |
| 445 | SMB | Windows file sharing (ransomware vector) |
| 3306 / 5432 | MySQL / PostgreSQL | DBs — **never expose to the internet** |
| 3389 | RDP | Remote Desktop — heavily attacked |

#### The Pyramid of Pain (David Bianco)

Higher = costlier for the attacker to adapt: **Hashes** (trivial) -> IPs -> Domains -> Network/Host artifacts -> Tools -> **TTPs** (hardest). Blocking a hash/IP barely inconveniences them; detecting their behavior (TTPs) forces a playbook rebuild.

    theory: `> ⚖️ **Ethics:** practice memory exploitation only in authorized teaching environments — PicoCTF, OverTheWire, your own lab binaries. Never run exploit code you don't understand, never against systems you don't own.

#### Define the words first

- **Buffer** — a fixed-size memory region for data. **Stack** — holds function-locals and the saved **return address** (where execution resumes on return); grows down.
- **Buffer overflow** — writing more than a buffer holds, so excess overwrites adjacent memory.
- **Return-address overwrite** — when the overflow reaches the saved return address, the attacker redirects execution -> arbitrary code execution (RCE).
- **Memory-safe language** — runtime checks bounds + manages memory (Node, Python, Java, Go, Rust): classic overflows prevented. **Memory-unsafe**: C/C++ (you enforce bounds manually).

#### The classic stack overflow, step by step

A C function copies attacker input into a fixed buffer WITHOUT a length check. Excess bytes spill past the buffer and overwrite the saved **return address**. On return, the CPU jumps to the attacker-controlled address. One missing length check = full control of execution.

#### Why modern systems resist this (defense in depth)

- **ASLR** — randomize addresses so the attacker can't predict where to jump.
- **DEP / NX** — mark stack/heap non-executable so injected data can't run.
- **Stack canaries** — a random value before the return address; if an overflow overwrites it, the program aborts before returning.
- **CFI** — verify return/jump targets are legitimate.

#### Why the naive assumptions fail

// Node - SECURE: resolve + refuse internal/metadata addresses (allow-list hosts when possible)
const dns = require("dns").promises;
async function safeFetch(rawUrl) {
